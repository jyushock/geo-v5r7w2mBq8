<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戦国大名家 家臣団ツリー</title>
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf7; --ink:#1f1b16; --ink2:#544a3e; --ink3:#847a6c;
  --line:#dbd1bd; --line2:#c5b89e; --accent:#7a2e2e; --hi:#fbf0d4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* 見出しと年の行をまとめて上に止める（2026-09-12）。
   以前は header と .years を別々に sticky にし、年の行を top:56px で止めていたが、
   見出しの高さは幅で変わり（1280px で 69px、ツールが折り返す 900px で 145px）、
   スクロールすると年の行が見出しの下端に重なった。1つの枠にまとめれば、
   見出しの高さが変わっても年の行はその直下に付いたまま止まる。
   狭い画面（520px 以下）も止める。地図のメニューの中（375×510）では
   見出しと年の行で 177px を使い、一覧に残るのは 333px。 */
#topbar{position:sticky; top:0; z-index:30}

header{
  display:flex; align-items:center; gap:14px; padding:9px 16px;
  border-bottom:1px solid var(--line2); background:linear-gradient(180deg,#fcf9f2,#f3eee1);
  flex-wrap:wrap;
}
header .mon{width:36px;height:36px;color:#2f4f7f;flex:none}
/* 家の紋の入れ物。中身（画像か汎用マーク）は app.js が差し替える */
#houseCrest{display:flex;flex:none}
/* 家紋の画像は縦横比がまちまち（touken-world は 210×141）なので、枠に収めて歪ませない */
img.mon{object-fit:contain}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
header .st{font-size:13px;color:var(--ink2)}
header .st b{color:var(--ink)}
header .spacer{flex:1}
header .tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
header input[type=search]{font:inherit;font-size:14px;padding:5px 10px;border:1px solid var(--line2);border-radius:5px;background:#fff;width:210px}
header select{font:inherit;font-size:13.5px;padding:4px 7px;border:1px solid var(--line2);border-radius:5px;background:#fff}
header label{font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;white-space:nowrap}
/* その表示では効かない操作。場所を残したまま無効にする（消すと右のツール列が動く） */
header label.off{opacity:.38}
header label.off input{cursor:not-allowed}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:#fff;flex:none}
.seg button{
  font:inherit;font-size:13.5px;padding:4px 12px;border:none;border-left:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap;
}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--hi);color:var(--ink)}
.seg button.on{background:#241f1a;color:#f7f3ea;font-weight:700}

.years{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:8px 16px; border-bottom:1px solid var(--line); background:#ece4d3;
}
.years button{
  font:inherit; font-size:14.5px; font-variant-numeric:tabular-nums;
  padding:4px 13px; border:1px solid var(--line2); border-radius:5px;
  background:#fff; color:var(--ink2); cursor:pointer; white-space:nowrap;
}
.years button:hover{background:var(--hi);color:var(--ink)}
/* 選択を太字にしない。この書体では太字の数字が 3px ほど細くなり、
   年を選ぶたびに後続の年ボタンが動く。選択は背景色だけで示す */
.years button.on{background:#241f1a;border-color:#241f1a;color:#f7f3ea}
.years button .ev{font-size:11.5px;opacity:.72;margin-left:4px}

main{padding:12px 14px 50px}
.note{
  margin:0 0 12px; padding:9px 12px; background:#fbf5e6; border:1px solid #e0d0a6;
  border-radius:6px; font-size:13px; color:#5c5138; line-height:1.6;
}

/* ===== 当主（根） ===== */
.lordblock{margin-bottom:18px}
.lordhead{
  display:flex; align-items:center; gap:11px; padding:9px 13px;
  background:linear-gradient(180deg,#31435f,#243449); color:#f4efe3;
  border-radius:8px 8px 0 0; box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.lordhead .mon{width:36px;height:36px;color:#e8ddc4;flex:none}
.lordhead .nm{font-size:20px;font-weight:700;letter-spacing:.05em}
.lordhead .sub{font-size:13px;opacity:.82}
.lordhead .cnt{margin-left:auto;font-size:14px;opacity:.9;font-variant-numeric:tabular-nums}
.lordbody{
  border:1px solid var(--line); border-top:none; border-radius:0 0 8px 8px;
  background:var(--card); padding:8px;
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; align-items:start;
}
@media (max-width:900px){ .lordbody{grid-template-columns:1fr} }
.lordbody.one{grid-template-columns:1fr}

/* ===== 身分区分 ===== */
.grp{border:1px solid #e8dfca; border-radius:6px; overflow:hidden; background:#fffefa}
.grp>h3{
  margin:0; padding:6px 10px; font-size:15px; font-weight:700; letter-spacing:.03em;
  background:#f0e8d6; border-bottom:1px solid #e5dbc4; cursor:pointer;
  display:flex; align-items:center; gap:7px;
}
.grp>h3 .n{margin-left:auto;font-size:13px;font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
.grp .body{padding:3px 0 5px}

/* ===== ツリー =====
   枝の線は、引く位置を下の変数から決める（2026-09-13 に描き直した）。
   以前は子の ul の左罫線で縦線を引いていたので、縦線が親の開閉ボックスの中心から外れ、
   最後の子の横線より下まで伸びて終端が閉じていなかった。開閉ボックスも文字の高さなりの縦長だった。
   --pad 行の左端からボックス / --bx ボックスの一辺 / --bt 行の上端からボックス / --gap ボックスと紋の間 /
   --ind 1段の字下げ。ボックスの中央の画素は、行の左から --pad+6px、上から --bt+6px（一辺13px） */
#tree{--pad:8px; --bx:13px; --bt:8px; --gap:7px; --ind:24px; --branch:#cdbf9f}
ul.kids{list-style:none;margin:0;padding:0}
ul.kids ul.kids{padding-left:var(--ind)}
li.node{position:relative}
/* 親のボックスの中央から下りる縦線。最後の子は自分の横線の高さで止める（└） */
ul.kids ul.kids>li.node::before{
  content:""; position:absolute; left:calc(var(--pad) + 6px - var(--ind)); top:0; bottom:0;
  width:1px; background:var(--branch);
}
ul.kids ul.kids>li.node:last-child::before{bottom:auto; height:calc(var(--bt) + 7px)}
/* 縦線から自分の行への横線。ボックスのある行はボックスの左端で止め、無い行はボックスがあれば右端になる位置まで引く */
ul.kids ul.kids>li.node::after{
  content:""; position:absolute; left:calc(var(--pad) + 6px - var(--ind)); top:calc(var(--bt) + 6px);
  width:calc(var(--ind) - 6px + var(--bx)); height:1px; background:var(--branch);
}
ul.kids ul.kids>li.node.has::after{width:calc(var(--ind) - 6px)}
/* 行の左にボックスの場所を空けておき、ボックスは位置を決めて置く。
   行が折り返しても、2行目以降はこの余白より右から始まるので、ボックスの下の線に重ならない */
.row{
  position:relative; display:flex; align-items:center; gap:var(--gap);
  padding:3px 8px 3px calc(var(--pad) + var(--bx) + var(--gap)); cursor:pointer;
  border-radius:4px; min-height:29px; color:inherit; text-decoration:none;
}
.row:hover{background:var(--hi)}
/* ボックスの下端から行の下端まで。子の縦線はそこから始まる */
.row.stem::after{
  content:""; position:absolute; left:calc(var(--pad) + 6px); top:calc(var(--bt) + var(--bx)); bottom:0;
  width:1px; background:var(--branch);
}
/* 開閉ボックス。押せる範囲は行の左の余白と1行目の高さに広げ、見える箱は ::before で描く。
   ＋／−は文字だと書体で上下にずれるので線で描く（一辺13pxの内側11pxの中央に7px） */
.row .tw{
  position:absolute; left:0; top:0;
  width:calc(var(--pad) + var(--bx) + var(--gap) / 2); height:calc(var(--bt) * 2 + var(--bx));
}
.row .tw::before{
  content:""; position:absolute; box-sizing:border-box;
  left:var(--pad); top:var(--bt); width:var(--bx); height:var(--bx);
  border:1px solid var(--branch); border-radius:2px;
  background:linear-gradient(var(--ink3),var(--ink3)) center/7px 1px no-repeat, #fff;
}
.row .tw.shut::before{
  background:linear-gradient(var(--ink3),var(--ink3)) center/7px 1px no-repeat,
    linear-gradient(var(--ink3),var(--ink3)) center/1px 7px no-repeat, #fff;
}
.row .mon{width:21px;height:21px;flex:none}
.row .nm{font-size:16px;font-weight:600;white-space:nowrap}
.row:hover .nm{color:var(--accent);text-decoration:underline}
.row .yr{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .meta{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.row .t24{
  font-size:11.5px;color:#7a2e2e;border:1px solid #cba7a7;border-radius:3px;
  padding:0 4px;flex:none;background:#fbf1f1;
}
.row .kn{font-size:11.5px;color:#4a6b4a;border:1px solid #b3c7b3;border-radius:3px;padding:0 4px;flex:none;background:#f1f6f1}
/* 生没年が欠けていて、その年の在世を確認できない人物 */
.row.est .nm{border-bottom:1px dotted #b6a179}
.row.est .yr{color:#a08d63}
/* その年の家中ではない／検索に一致しない人物。行ごとではなく中身を薄くし、
   枝の線（.row.stem::after）は他の行と同じ濃さで続ける */
.row.dim>*{opacity:.3}
.row.dim:hover>*{opacity:.85}
.empty{padding:5px 12px;font-size:13px;color:var(--ink3)}

/* 凡例 */
.legend{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  margin-left:auto; font-size:12.5px; color:var(--ink2);
}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{font-style:normal}
.legend .sw-est{border-bottom:1px dotted #b6a179;color:var(--ink)}
.legend .sw-dim{opacity:.3;color:var(--ink)}
.legend .sw-sure{color:var(--ink);font-weight:600}
.legend .sw-meta{color:var(--ink3);font-size:12px}

footer{padding:14px 16px 36px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);margin-top:18px}

#tip{
  position:fixed;pointer-events:none;z-index:99;opacity:0;transition:opacity .09s;
  background:var(--card);color:var(--ink2);font-size:13px;line-height:1.55;padding:9px 12px;
  border:1px solid var(--line2);border-radius:6px;max-width:360px;
  box-shadow:0 8px 24px rgba(70,52,24,.18);
}
#tip b{color:var(--ink);font-size:14.5px}
#tip .s{color:var(--ink2);font-size:12px}
#tip .w{color:var(--accent);font-size:12px}

/* 先頭へ戻るボタン。スクロールしている間だけ出す（app.js）。
   消している間も fixed で場所を取らないので、出し入れで一覧は動かない */
#toTop{
  position:fixed; right:14px; bottom:16px; z-index:40;
  width:44px; height:44px; border:none; border-radius:50%; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:#241f1a; color:#f7f3ea; box-shadow:0 3px 10px rgba(0,0,0,.28);
  cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s;
}
#toTop.show{opacity:.9; pointer-events:auto}

/* ===== 狭い画面（iPhone SE3 = 375px を含むスマートフォン縦） ===== */
@media (max-width:520px){
  body{font-size:14px}
  header{padding:7px 10px;gap:8px}
  header .mon{width:28px;height:28px}
  header h1{font-size:17px}
  header .st{font-size:12px;line-height:1.4}
  header .spacer{display:none}
  header .tools{width:100%;gap:7px}
  header input[type=search]{flex:1;width:auto;min-width:0;font-size:14px;padding:4px 8px}
  header label{font-size:12.5px}

  /* 年ボタンは1行の横スクロールにして縦を食わせない */
  .years{
  padding:6px 10px; gap:5px;
  flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .years::-webkit-scrollbar{height:3px}
  .years button{font-size:13.5px;padding:4px 10px;flex:none}
  .years button .ev{display:none}
  .legend{display:none}

  main{padding:8px 8px 40px}
  .note{font-size:12px;padding:8px 10px;line-height:1.55}
  .lordblock{margin-bottom:12px}
  .lordhead{padding:7px 10px;gap:8px}
  .lordhead .mon{width:28px;height:28px}
  .lordhead .nm{font-size:17px}
  .lordhead .sub{font-size:11.5px;line-height:1.35}
  .lordhead .cnt{font-size:12.5px}
  .lordbody{padding:5px}
  .grp>h3{font-size:14px;padding:5px 8px}
  .seg button{font-size:12.5px;padding:4px 9px}

  /* 入れ子のインデントを詰める。ボックスの中央は1行目（名前 15.5px×1.5）の中央に合わせる */
  #tree{--pad:6px; --bt:9px; --gap:5px; --ind:18px}

  /* 1行に詰め込まず、氏族は2行目へ回す */
  .row{flex-wrap:wrap;padding:4px 6px 4px calc(var(--pad) + var(--bx) + var(--gap));gap:var(--gap);min-height:0}
  .row .mon{width:19px;height:19px}
  .row .nm{font-size:15.5px}
  .row .yr{font-size:12px}
  .row .t24, .row .kn{font-size:10.5px;padding:0 3px}
  .row .meta{
  flex:0 0 calc(100% - 6px); margin-left:6px; font-size:11px; line-height:1.35;
  white-space:normal; overflow:visible; order:1;
  }
  .row .meta:empty{display:none}
  /* 子・配下の人数は PC と同じく1行目の右端に置く（DOM では氏族の後ろにあり、そのままだと
     3行目の左端に落ちて枝の線に重なっていた）。入りきらずに折り返しても右端に寄る */
  .row .kc{margin-left:auto}

  #toTop{right:10px;bottom:12px}
}

</style>
</head>
<body>

<!-- 家紋は元サイトの画像をそのまま出す（取得ツールが crests/ に書き出す）。ここに置くのは、
     画像が無い人に出す汎用マークだけ。以前は紋の型ごとに手で描いた図案を置いていたが、
     実物と大きく違ったため 2026-09-12 にやめた -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="m-generic" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="5">
  <circle cx="50" cy="50" r="43"/><circle cx="50" cy="50" r="22" stroke-dasharray="6 6"/></g></symbol>
</defs></svg>

<!-- 見出しと年の行は1つの枠にまとめて上に止める（style.css の #topbar） -->
<div id="topbar">
<header>
  <!-- 家の紋。選ばれた家に合わせて app.js が中身を差し替える（画像か、無ければ汎用マーク） -->
  <span id="houseCrest"><svg class="mon"><use href="#m-generic"/></svg></span>
  <div>
    <!-- 選ばれた家に合わせて app.js が「◯◯家家臣団」にする -->
    <h1 id="houseTitle">家臣団</h1>
    <div class="st" id="stat"></div>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <!-- 選択肢が家名なので「家」の見出しは付けない（2026-09-13 に外した） -->
    <select id="house" aria-label="大名家"></select>
    <span class="seg" id="view">
      <button data-v="lords">当主別</button>
      <button data-v="whole">家全体</button>
      <button data-v="kin">家系</button>
    </span>
    <input type="search" id="q" placeholder="名前・氏族・主君で検索">
    <label id="grpw"><input type="checkbox" id="grp" checked> 身分区分でまとめる</label>
    <label><input type="checkbox" id="dim" checked> 対象外も薄く残す</label>
  </div>
</header>

<div class="years" id="years"></div>
</div>

<main>
  <div id="tree"></div>
</main>

<div id="tip"></div>

<!-- 先頭へ戻る。スクロールしている間だけ出す（app.js） -->
<button id="toTop" type="button" title="先頭へ" aria-label="ページの先頭へ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 14 12 8 18 14"/></svg></button>

<footer>
  出典：<a href="https://ja.wikipedia.org/" target="_blank" rel="noopener">日本語版ウィキペディア</a>／
  テキストは <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 4.0</a>。
  データの作り方と限界は SamuraiRetainers の docs/data-notes.md、操作は retainers/usage.md。
</footer>

<!-- データは別ファイル。表示のプログラムにデータを内包しない。
     file:// で開いても読めるよう、fetch ではなく script で読む
     （fetch はローカルファイルだと CORS で弾かれる）。 -->
<script src="data.js"></script>
<script>
/* 大名家の家臣団
   データの根拠と限界は取得ツール（D:\work\SamuraiRetainers）の docs/data-notes.md、画面の操作は usage.md に置く。
   ここでは実装上の判断だけをコメントに残す。
   当主・年表・身分区分は家ごとに違うので、DATA.houses から引く。 */

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* 氏名は「姓 名」で持つが、記事名や infobox の父・子の欄は空白なしで書かれる。
   人物の照合と検索は、空白を落としてから行う。 */
const nosp = s => String(s == null ? '' : s).replace(/\s+/g, '');

/* ---------- 家 ----------
   当主列・年表・紋・身分区分は家ごとに違うので、定義（DATA.houses）から引く。
   当主の家督年と生没年、当主同士の親子関係は infobox から辿れない
   （当主は家臣ではないので people に入らない）ため、取得ツールが定義として書き出す。

   人物は house でどの家の家中かが分かる。1人が複数の家に仕えた場合は
   家ごとに1件あるので、家を切り替えるときに絞り直す。 */
const HOUSES = DATA.houses;
const RANK_PALETTE = ['#2f4f7f', '#6b4a2f', '#7a2e2e', '#3f6b45', '#5b4a8a', '#7a7266'];

let house, P, LORDS, YEARS, LORD_TITLES, EXTRA, ALL;
let RANK_COLOR = {}, RANK_ORDER = {}, BY = {}, BYID = {}, KIN_PAR = {}, KIN_KID = {};

/* 家を切り替える。家に依存するものは全てここで作り直す */
function setHouse(key) {
  house = HOUSES.find(h => h.key === key) || HOUSES[0];
  P = DATA.people.filter(p => p.house === house.key);
  LORDS = house.lords;
  YEARS = house.years;
  LORD_TITLES = LORDS.map(l => l.t);

  /* 身分区分の色と序列。区分は家ごとに違うので、定義の並び順に割り当てる */
  RANK_COLOR = {};
  RANK_ORDER = {};
  house.ranks.forEach((r, i) => {
    RANK_COLOR[r] = RANK_PALETTE[i % RANK_PALETTE.length];
    RANK_ORDER[r] = i;
  });

  /* 当主の擬似ノード。当主は people に無い（家臣として収集していない）ので、
     全体ツリーと家系表示で親子の骨格を描くために家の定義から作る */
  EXTRA = LORDS.filter(l => !P.some(p => p.t === l.t)).map((l, i) => ({
    id: -1 - i, t: l.t, n: l.n || l.t, house: house.key,
    u: 'https://ja.wikipedia.org/wiki/' + encodeURIComponent(l.t),
    b: l.b, d: l.d, br: '', dr: '',
    lords: [], gens: [], clans: [house.lordClan], clan: house.lordClan,
    rank: house.ranks[0], rankWhy: '当主', rankSure: 1, rankTitle: '', kuni: null, t24: false,
    crest: house.crestImg ? { img: house.crestImg, name: '', clan: house.lordClan, rep: false } : null,
    father: l.father ? [l.father] : [], children: [], parent: null, _lord: true,
  }));

  ALL = P.concat(EXTRA);
  BY = {}; BYID = {};
  ALL.forEach(p => { BY[p.t] = p; BYID[p.id] = p; });
  buildKin();

  // ヘッダの紋と題も選ばれた家のものにする
  const hc = document.getElementById('houseCrest');
  if (hc) hc.innerHTML = mon(house.crestImg);
  const ht = document.getElementById('houseTitle');
  if (ht) ht.textContent = house.name + '家臣団';
  document.title = house.name + '家臣団';

  year = 0;
  closed.clear();
}

/* ---------- 並び順 ----------
   特筆される家臣（武田家なら二十四将）→ 身分区分の序列 → 官位の等級 → 生年 → 名前。
   官位は自由記述で受領名・自称を含むため、四等官の段階までの粗い目安にとどめる
   （精度については docs/data-notes.md）。 */
const OFFICE_GRADE = [[/守|大輔|頭|大夫|卿/, 1], [/介|少輔|助|亮/, 2], [/佐|丞|允|尉|進/, 3], [/目|属|志/, 4]];
function officeGrade(t) {
  if (!t) return 9;                       // 記載なしは最後
  let v = 8;                              // 記載はあるが四等官に落とせないものは、その手前
  for (const [re, n] of OFFICE_GRADE) if (re.test(t)) v = Math.min(v, n);
  return v;
}
function cmp(a, b) {
  return (a.t24 ? 0 : 1) - (b.t24 ? 0 : 1)
    || (RANK_ORDER[a.rank] ?? 99) - (RANK_ORDER[b.rank] ?? 99)
    || officeGrade(a.rankTitle) - officeGrade(b.rankTitle)
    || (a.b || 9999) - (b.b || 9999)
    || a.n.localeCompare(b.n, 'ja');
}

/* ---------- 血縁 ----------
   father / children は、養父・養子と娘の婿を除いた実の親子だけが入っている
   （選別は取得ツールの Wikitext.KinLinks、養子縁組の突き合わせは RetainersBuilder）。
   ここではさらに、この一覧の中に同名の人物がいるものだけを結ぶ（家中以外は落ちる）。
   つながる範囲が限られることは docs/data-notes.md に計測結果を置いた。 */
function buildKin() {
  KIN_PAR = {}; KIN_KID = {};
  const byName = {};
  ALL.forEach(p => { const k = nosp(p.n); (byName[k] = byName[k] || []).push(p); });
  const res = n => BY[n] || (byName[nosp(n)] && byName[nosp(n)].length === 1 ? byName[nosp(n)][0] : null);
  const link = (par, chi) => {
    if (!par || !chi || par.t === chi.t) return;
    (KIN_PAR[chi.t] = KIN_PAR[chi.t] || []).push(par.t);
    (KIN_KID[par.t] = KIN_KID[par.t] || []).push(chi.t);
  };
  ALL.forEach(p => {
    (p.father || []).forEach(n => link(res(n), p));
    (p.children || []).forEach(n => link(p, res(n)));
  });
  [KIN_PAR, KIN_KID].forEach(M => Object.keys(M).forEach(k => M[k] = [...new Set(M[k])]));
}
const kinKids = t => (KIN_KID[t] || []).map(x => BY[x]).filter(Boolean).sort(cmp);
const kinPars = t => (KIN_PAR[t] || []).map(x => BY[x]).filter(Boolean);

/* ---------- 主従 ----------
   親→子。年を指定したときは、その年の当主に仕えた記載のある者を当主の直下に付け替える
   （山県昌景は信玄・勝頼の両方に仕えたので、1573年を選べば勝頼の下に来る）。
   年を指定しないときの parent は、最初に仕えた代の当主（収集時に決めている）。 */
let KIDS = {};
function buildKids(y) {
  const L = y ? lordAt(y) : null;
  const K = {};
  P.forEach(p => {
    // その年の当主本人は根なので、家臣として置かない（勝頼は信玄の家臣でもあるため）
    if (L && p.t === L.t) return;
    let par = p.parent;
    if (L && isDirect(p)) {
      // その年の当主に仕えた記載があれば当主直下へ。
      // 無い場合、「対象外も薄く残す」なら当主直下に薄く置き、そうでなければ出さない
      par = p.lords.some(l => l.t === L.t) ? L.t : (dimMode ? L.t : null);
    }
    if (par && par !== p.t) (K[par] = K[par] || []).push(p);
  });
  Object.values(K).forEach(a => a.sort(cmp));
  return K;
}

let year = 0, view = 'lords', useGrp = true, dimMode = true, query = '';
const closed = new Set();

/* その年の当主。家督を継いだ年（from）が過ぎた当主のうち、最も新しい人。
   最初の当主は家督開始年が分からないことがあるので、既定にする。 */
function lordAt(y) {
  if (!y) return null;
  let cur = LORDS[0];
  for (const l of LORDS) if (l.from != null && y >= l.from) cur = l;
  return cur;
}
const isDirect = p => p.lords.some(l => LORD_TITLES.includes(l.t));
const isKin = () => view === 'kin';
const isFlat = () => view === 'whole';
/* 家全体は代でも主従でも分けない一枚の一覧なので、入れ子を持たせない */
const childrenOf = p => isKin() ? kinKids(p.t) : isFlat() ? [] : (KIDS[p.t] || []);

function aliveAt(p, y) {
  if (p.b && p.d) return p.b <= y && y <= p.d;
  if (p.b) return p.b <= y ? null : false;
  if (p.d) return p.d >= y ? null : false;
  return null;
}
/* その年に家中にいたか。陪臣は主人が家中にいたかで判断する */
let memo = new Map();
function inHouse(p, y) {
  if (!y) return { on: true, est: false };
  if (p._lord) { const a = aliveAt(p, y); return { on: a !== false, est: a === null }; }
  const k = p.id;
  if (memo.has(k)) return memo.get(k);
  const r = { on: false, est: false };
  memo.set(k, r);
  const L = lordAt(y);
  let served;
  if (isKin()) {
    served = true;                        // 家系表示では主従で絞らず、在世だけで判断する
  } else if (isDirect(p)) {
    served = p.lords.some(l => l.t === L.t);
  } else {
    const par = p.parent && BY[p.parent];
    served = par ? inHouse(par, y).on : false;
  }
  const a = aliveAt(p, y);
  r.on = served && a !== false;
  r.est = r.on && a === null;
  return r;
}
const hit = p => !query || nosp(p.n).includes(query) || nosp(p.t).includes(query) ||
  (p.clans || []).some(c => nosp(c).includes(query)) ||
  p.lords.some(l => nosp(l.l).includes(query) || nosp(l.t).includes(query)) ||
  nosp(p.kuni).includes(query) || nosp(p.alias).includes(query) || nosp(p.rank).includes(query);

/* 家紋は元サイトの画像をそのまま出す（取得ツールが crests/ に書き出す。CrestImages）。
   以前は紋の名前から型を決めて手で描いた図案を出していたが、実物と大きく違ったため 2026-09-12 にやめた。
   画像が無いときだけ汎用マーク（template.html の #m-generic）を出す。
   level 0=その家の紋 / 1=紋の画像が無い（汎用マーク） / 2=一族の代表紋（個々の家の紋ではない）
   紋の名前は分かっても画像が無い場合（crest.img が無い）は、汎用マークになるので 1 として薄く出す。
   濃く出すと、その家の紋を出せているように見えてしまうため。
   size・color・level を省くと、大きさと色は style.css に任せる（見出しの紋） */
const monLevel = p => !p.crest || !p.crest.img ? 1 : (p.crest.rep ? 2 : 0);
function mon(img, color, size, level) {
  const box = size ? 'width:' + size + 'px;height:' + size + 'px;' : '';
  const op = level === 1 ? 'opacity:.22;' : level === 2 ? 'opacity:.45;' : '';
  if (img) return '<img class="mon" src="' + esc(img) + '" alt="" loading="lazy" decoding="async" style="' + box + op + '">';
  return '<svg class="mon" style="' + box + (color ? 'color:' + color + ';' : '') + op + '"><use href="#m-generic"/></svg>';
}

/* 表示判定：自分か子孫のどれかが対象なら出す */
let showCache = new Map();
function visible(p) {
  if (showCache.has(p.id)) return showCache.get(p.id);
  let v = inHouse(p, year).on && hit(p);
  showCache.set(p.id, v);
  if (!v) {
    for (const c of childrenOf(p)) if (visible(c)) { v = true; break; }
    showCache.set(p.id, v);
  }
  return v;
}
function countTree(p, seen) {
  seen = seen || new Set();
  if (seen.has(p.t)) return 0;      // 万一の循環を止める
  seen.add(p.t);
  let n = inHouse(p, year).on && hit(p) ? 1 : 0;
  childrenOf(p).forEach(c => n += countTree(c, seen));
  return n;
}

const drawn = new Set();
function nodeHtml(p, color) {
  if (drawn.has(p.t)) return '';    // 同じ人物を二度描かない（循環対策）
  drawn.add(p.t);
  const kids = childrenOf(p);
  const st = inHouse(p, year);
  const on = st.on && hit(p);
  if (!on && !dimMode) {
    /* 対象外を薄く残さないときは本人を描かず、子孫に対象の人物がいれば本人の位置へ繰り上げる。
       以前は子孫へたどる道として本人を薄く残していたため、チェックを外しても薄い行が残った
       （年で絞った家系で先に亡くなった父、検索に一致しない主人など。2026-09-13）。
       本人が畳まれていても、描かない本人は開けないので、子孫はそのまま出す */
    return visible(p) ? kids.map(c => nodeHtml(c, color)).join('') : '';
  }
  const open = !closed.has(p.t);
  const inner = kids.length && open ? kids.map(c => nodeHtml(c, color)).join('') : '';
  const fa = kinPars(p.t);
  const meta = [(p.clans || []).join('→'), p.rankTitle,
    (!isKin() && fa.length ? '父：' + fa.map(x => x.n).join('・') : '')].filter(Boolean).join('　');
  /* 枝の線は style.css で描く。li の has は開閉ボックスの有無（横線をボックスの手前で止める）、
     行の stem は下に子を描いたこと（ボックスの下端から子の縦線へつなぐ線を引く） */
  let h = '<li class="node' + (kids.length ? ' has' : '') + '">' +
    /* 行は Wikipedia へのリンクそのもの。地図の城シートの Wikipedia ボタンと同じ
       <a target="_blank"> で開く（window.open(url, '_blank', 'noopener') だと
       iPhone で記事から戻るときに空のページを挟んだため、2026-09-12 に揃えた） */
    '<a class="row' + (on ? '' : ' dim') + (on && st.est ? ' est' : '') + (inner ? ' stem' : '') + '" href="' + esc(p.u) +
      '" target="_blank" data-id="' + p.id + '">' +
    /* 開閉ボックス。＋／−は文字だと書体で上下にずれるので、style.css で線として描く。
       子の無い行には置かない（押しても開閉するものが無く、記事も開けなかったため） */
    (kids.length ? '<span class="tw' + (open ? '' : ' shut') + '" data-tw="' + esc(p.t) + '"></span>' : '') +
    mon(p.crest ? p.crest.img : null, color, 21, monLevel(p)) +
    '<span class="nm">' + esc(p.n) + '</span>' +
    (p.t24 && house.featuredShort ? '<span class="t24">' + esc(house.featuredShort) + '</span>' : '') +
    (p.kuni ? '<span class="kn">' + esc(p.kuni) + '</span>' : '') +
    '<span class="yr">' + (p.b || '?') + '–' + (p.d || '?') + '</span>' +
    '<span class="meta">' + esc(meta) + '</span>' +
    (kids.length ? '<span class="yr kc">' + (isKin() ? '子' : '配下') + kids.length + '</span>' : '') +
    '</a>';
  if (inner) h += '<ul class="kids">' + inner + '</ul>';
  return h + '</li>';
}

/* 当主直下を、身分区分でまとめる／2列に流す（当主別の表示で使う） */
function bodyHtml(L, direct) {
  let h = '<div class="lordbody">';
  if (useGrp) {
    house.ranks.forEach(rank => {
      const list = direct.filter(p => p.rank === rank);
      if (!list.length) return;
      const cnt = list.reduce((a, c) => a + countTree(c), 0);
      if (!cnt && !dimMode) return;
      const gk = 'G:' + L.t + ':' + rank;
      const open = !closed.has(gk);
      const col = RANK_COLOR[rank];
      h += '<section class="grp"><h3 data-tw="' + esc(gk) + '" style="color:' + col + '">' +
        (open ? '▾' : '▸') + ' ' + esc(rank) + '<span class="n">' + cnt + '名</span></h3>';
      if (open) {
        const inner = list.map(p => nodeHtml(p, col)).join('');
        h += '<div class="body">' + (inner ? '<ul class="kids">' + inner + '</ul>'
          : '<div class="empty">この年に該当者なし</div>') + '</div>';
      }
      h += '</section>';
    });
  } else {
    const half = Math.ceil(direct.length / 2);
    h += [direct.slice(0, half), direct.slice(half)].map(part =>
      '<section class="grp"><div class="body"><ul class="kids">' +
      part.map(p => nodeHtml(p, RANK_COLOR[p.rank] || '#7a7266')).join('') +
      '</ul></div></section>').join('');
  }
  return h + '</div>';
}

function lordHead(L, direct) {
  const n = direct.reduce((a, c) => a + countTree(c), 0);
  return '<div class="lordhead">' +
    mon(house.crestImg) +
    '<div><div class="nm">' + esc(L.n || L.t) + '</div>' +
    '<div class="sub">' + L.b + '–' + L.d + '　' + esc(L.note) + '</div></div>' +
    '<div class="cnt">家中 ' + n + '名' + (year ? '' : ' / 記載のある家臣 ' + direct.length + '家') + '</div></div>';
}

/* 家全体：当主を意識しない、家中全員のフラットな一覧。
   当主別が「どの代に仕えたか」で3つに割り、主従で入れ子にするのに対し、
   こちらは代でも主従でも分けず、並び順だけで通しに並べる。
   誰に仕えたかは行に出さず、ツールチップの「主君」で見る。 */
function flatHtml() {
  const on = p => inHouse(p, year).on && hit(p);
  const list = P.filter(p => dimMode || on(p)).sort(cmp);
  const n = P.filter(on).length;
  let h = '<div class="lordblock"><div class="lordhead">' +
    mon(house.crestImg) +
    '<div><div class="nm">' + esc(house.name) + '　全体</div>' +
    '<div class="sub">当主で分けず、家中の全員を通しで並べています</div></div>' +
    '<div class="cnt">' + (year ? 'この年の家中 ' : '') + n + '名</div></div>' +
    '<div class="lordbody">';
  const section = (title, col, part) => {
    if (!part.length) return '';
    if (!title) {
      const inner = part.map(p => nodeHtml(p, col)).join('');
      return inner ? '<section class="grp"><div class="body"><ul class="kids">' + inner + '</ul></div></section>' : '';
    }
    const gk = 'F:' + title;
    const open = !closed.has(gk);
    let x = '<section class="grp"><h3 data-tw="' + esc(gk) + '" style="color:' + col + '">' +
      (open ? '▾' : '▸') + ' ' + esc(title) + '<span class="n">' + part.filter(on).length + '名</span></h3>';
    if (open) {
      const inner = part.map(p => nodeHtml(p, col)).join('');
      x += '<div class="body">' + (inner ? '<ul class="kids">' + inner + '</ul>'
        : '<div class="empty">この年に該当者なし</div>') + '</div>';
    }
    return x + '</section>';
  };
  if (useGrp) {
    house.ranks.forEach(rank => h += section(rank, RANK_COLOR[rank], list.filter(p => p.rank === rank)));
  } else {
    const half = Math.ceil(list.length / 2);
    h += section('', '#7a7266', list.slice(0, half)) + section('', '#7a7266', list.slice(half));
  }
  return h + '</div></div>';
}

/* 血縁の森。親が特定できない者を根とし、2名以上つながる木だけをツリーで見せる */
function kinHtml() {
  const roots = ALL.filter(p => !kinPars(p.t).length).sort(cmp);
  const trees = [], alone = [];
  roots.forEach(p => (kinKids(p.t).length ? trees : alone).push(p));
  let h = '<div class="lordblock"><div class="lordhead">' +
    mon(house.crestImg) +
    '<div><div class="nm">' + esc(house.name) + '　家系</div>' +
    '<div class="sub">infobox の父・子のうち実の親子だけを、家中で相手を特定できた分だけ結んでいます</div></div>' +
    '<div class="cnt">' + trees.length + '系統 / 単独 ' + alone.length + '名</div></div>' +
    '<div class="lordbody">';
  trees.forEach(p => {
    const col = RANK_COLOR[p.rank] || '#7a7266';
    const inner = nodeHtml(p, col);
    if (inner) h += '<section class="grp"><div class="body"><ul class="kids">' + inner + '</ul></div></section>';
  });
  h += '</div>';
  const shown = alone.filter(p => inHouse(p, year).on && hit(p));
  if (shown.length) h += '<div class="note">血縁の相手を家中で特定できない人物が ' + shown.length +
    '名います。父・子の欄が空か、相手がこの一覧に入っていないか、養子縁組だけの関係です' +
    '（docs/data-notes.md）。</div>';
  return h + '</div>';
}

function render() {
  memo = new Map(); showCache = new Map(); drawn.clear();
  KIDS = buildKids(isKin() ? 0 : year);
  const L = lordAt(year);

  document.getElementById('years').innerHTML =
    YEARS.map(v => '<button data-y="' + v.y + '"' + (v.y === year ? ' class="on"' : '') + '>' +
      esc(v.lb) + (v.ev ? '<span class="ev">' + esc(v.ev) + '</span>' : '') + '</button>').join('') +
    '<span class="legend">' +
    (year
      ? '<span><i class="sw-sure">山県昌景</i> この年に在世</span>' +
        '<span><i class="sw-est">山県昌景</i> 在世は未確認</span>' +
        '<span><i class="sw-dim">山県昌景</i> この年の家中ではない</span>'
      : '<span>年を選ぶと、その年の当主と家中に絞り込みます</span>') +
    '</span>';

  let html = '', total = 0, est = 0;
  const pool = isKin() ? ALL : P;
  pool.forEach(p => { const s = inHouse(p, year); if (s.on && hit(p)) { total++; if (s.est) est++; } });

  if (isKin()) {
    html = kinHtml();
  } else if (view === 'whole') {
    html = flatHtml();
  } else {
    (L ? [L] : LORDS).forEach(L2 => {
      const direct = KIDS[L2.t] || [];
      html += '<div class="lordblock">' + lordHead(L2, direct) + bodyHtml(L2, direct) + '</div>';
    });
  }
  document.getElementById('tree').innerHTML = html;

  document.getElementById('stat').innerHTML =
    (year ? '<b>' + year + '年</b> <b>' + total + '名</b>' + (est ? '（推定 ' + est + '）' : '')
          : '全 <b>' + P.length + '名</b>');
}

/* ---------- 操作 ---------- */
function setView(v) {
  view = v;
  document.querySelectorAll('#view button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  // 家系は血縁でつなぐため、身分区分のまとめは効かない。
  // 消すと右寄せのツール列が縮んで左側のボタンが動くので、場所は残して無効にする
  const w = document.getElementById('grpw');
  w.classList.toggle('off', isKin());
  w.title = isKin() ? '家系は血縁でつなぐため、身分区分のまとめは使えません' : '';
  document.getElementById('grp').disabled = isKin();
  render();
}
/* 表示・年・家を選び直したら、一覧は先頭から見せる（並びも人数も変わるので、前の位置に意味が無い）。
   setView の中で戻さないのは、起動時の setView でも先頭へ動かしてしまうため */
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  setView(b.dataset.v);
  scrollTo(0, 0);
});
document.getElementById('years').addEventListener('click', e => {
  const b = e.target.closest('button[data-y]'); if (!b) return;
  year = +b.dataset.y; render();
  scrollTo(0, 0);
});
document.getElementById('tree').addEventListener('click', e => {
  const tw = e.target.closest('[data-tw]');
  if (tw) {
    e.preventDefault();             // 開閉ボタンは行（リンク）の中にあるので、記事へ飛ばさない
    const k = tw.dataset.tw;
    closed.has(k) ? closed.delete(k) : closed.add(k);
    render(); return;
  }
  // 行のタップは <a target="_blank"> の既定の動作で記事を開く
});
document.getElementById('q').addEventListener('input', e => { query = nosp(e.target.value); render(); });
document.getElementById('grp').addEventListener('change', e => { useGrp = e.target.checked; render(); });
document.getElementById('dim').addEventListener('change', e => { dimMode = e.target.checked; render(); });
/* 家の切り替え。当主列・年表・紋・身分区分は、選ばれた家の定義から引く。
   家臣の多い順に並べる（人数が0の家は選んでも何も出ないので後ろへ） */
const houseSel = document.getElementById('house');
const HOUSE_SIZE = {};
DATA.people.forEach(p => HOUSE_SIZE[p.house] = (HOUSE_SIZE[p.house] || 0) + 1);
houseSel.innerHTML = HOUSES.slice()
  .sort((a, b) => (HOUSE_SIZE[b.key] || 0) - (HOUSE_SIZE[a.key] || 0) || a.name.localeCompare(b.name, 'ja'))
  .map(h => '<option value="' + h.key + '">' + esc(h.name) +
       '（' + (HOUSE_SIZE[h.key] || 0) + '名）</option>').join('');
houseSel.disabled = HOUSES.length < 2;
houseSel.addEventListener('change', e => {
  setHouse(e.target.value);
  setView(view);
  // 別の家の一覧になるので、前の家で読んでいた位置を引き継がず先頭から見せる
  scrollTo(0, 0);
});

/* ツールチップはマウスのときだけ出す。スマートフォンのタップでも mouseover → mousemove → … → click が届き、
   mouseout は別の要素をタップするまで来ない（Apple の Safari Web Content Guide「Handling Events」）。
   そのため記事から戻っても出たまま残り、位置も画面外にはみ出していた（2026-09-12、iPhone SE3）。
   pointer イベントなら pointerType でマウスとタップを見分けられる */
const tip = document.getElementById('tip');
const byMouse = e => e.pointerType === 'mouse';
document.addEventListener('pointerover', e => {
  if (!byMouse(e)) return;
  const row = e.target.closest('.row'); if (!row) return;
  const p = BYID[row.dataset.id];
  const kids = childrenOf(p);
  const fa = kinPars(p.t), ch = kinKids(p.t);
  const s = year ? inHouse(p, year) : null;
  tip.innerHTML = '<b>' + esc(p.n) + '</b>' + (p.t24 && house.featured ? ' <span class="w">' + esc(house.featured) + '</span>' : '') +
    '<br><span class="s">生没：' + esc(p.br || (p.b ? p.b + '–' + (p.d || '?') : '記載なし')) +
      (p.br ? ' ／ ' + esc(p.dr || '記載なし') : '') + '</span>' +
    '<br><span class="s">主君：' + esc(p.lords.map(l => l.l).join('→') || '記載なし') + '</span>' +
    (fa.length ? '<br><span class="s">父：' + esc(fa.map(x => x.n).join('・')) + '</span>' : '') +
    (ch.length ? '<br><span class="s">子：' + esc(ch.map(x => x.n).join('、')) + '</span>' : '') +
    (!isKin() && p.parent ? '<br><span class="s">この画面での主人：' + esc((BY[p.parent] || {}).n || p.parent) + '</span>' : '') +
    (!isKin() && kids.length ? '<br><span class="s">配下：' + esc(kids.map(k => k.n).join('、')) + '</span>' : '') +
    '<br><span class="s">氏族：' + esc((p.clans || []).join('→') || '記載なし') + (p.kuni ? '／' + esc(p.kuni) + '国' : '') + '</span>' +
    (p.rankTitle ? '<br><span class="s">官位：' + esc(p.rankTitle) + '</span>' : '') +
    '<br><span class="s">区分：' + esc(p.rank) + (p.rankWhy ? '（' + esc(p.rankWhy) + '）' : '') +
      (p.rankSure ? '' : ' <span class="w">推定</span>') + '</span>' +
    (p.crest ? '<br><span class="s">家紋：' + esc(p.crest.name || '名称なし') +
      '（' + esc(p.crest.clan) + (p.crest.rep ? ' の代表紋' : ' の紋') + '）' +
      (p.crest.img ? '' : ' <span class="w">画像なし</span>') + '</span>' : '') +
    (s && s.est ? '<br><span class="w">この年の在世は確認できません</span>' : '') +
    '<br><span class="s">クリックで Wikipedia</span>';
  tip.style.opacity = 1;
});
document.addEventListener('pointermove', e => {
  if (!byMouse(e) || tip.style.opacity != 1) return;
  let x = e.clientX + 15, y = e.clientY + 17;
  if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - 15;
  if (y + tip.offsetHeight > innerHeight - 8) y = e.clientY - tip.offsetHeight - 17;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('pointerout', e => { if (byMouse(e) && e.target.closest('.row')) tip.style.opacity = 0; });

/* ---------- 先頭へ戻るボタン ----------
   スクロールしている間だけ出し、止まってから2秒で消す（2026-09-12 に決定）。
   止まってすぐに消さないのは、スマートフォンでは慣性スクロール中の最初のタップが
   スクロールを止めるだけで押せないため、止まったあとに押す猶予を残す。
   先頭に着いたら待たずに消す（そこで押しても動かないため）。 */
const toTop = document.getElementById('toTop');
let toTopTimer = 0;
addEventListener('scroll', () => {
  clearTimeout(toTopTimer);
  if (scrollY <= 0) { toTop.classList.remove('show'); return; }
  toTop.classList.add('show');
  toTopTimer = setTimeout(() => toTop.classList.remove('show'), 2000);
}, { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

setHouse(houseSel.value || HOUSES[0].key);
setView('lords');

</script>
</body>
</html>
