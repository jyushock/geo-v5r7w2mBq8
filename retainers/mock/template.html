<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戦国大名家 表現方法モック</title>
<style>
:root{
  --paper:#f6f2e8; --paper2:#efe9db; --ink:#2b2622; --ink2:#6b6055;
  --line:#d8cfbc; --line2:#c2b69d; --accent:#7a2e2e;
  --shadow:0 1px 3px rgba(60,45,25,.14), 0 8px 24px rgba(60,45,25,.06);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  font-size:var(--fs); line-height:1.7;
}
header.top{
  padding:22px 28px 14px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fbf8f1,var(--paper));
}
header.top h1{
  margin:0 0 4px; font-size:24px; font-weight:600; letter-spacing:.08em;
  display:flex; align-items:center; gap:12px;
}
header.top h1 .crest{width:34px;height:34px;color:#2f4f7f}
header.top .sub{color:var(--ink2); font-size:12.5px; letter-spacing:.02em}
header.top .sub b{color:var(--ink); font-weight:600}

nav.tabs{
  display:flex; flex-wrap:wrap; gap:6px; padding:12px 28px;
  border-bottom:1px solid var(--line); background:var(--paper2);
  position:sticky; top:0; z-index:20;
}
nav.tabs button{
  font-family:inherit; font-size:13px; color:var(--ink2);
  background:transparent; border:1px solid transparent; border-radius:999px;
  padding:5px 13px; cursor:pointer; letter-spacing:.04em; transition:.15s;
}
nav.tabs button:hover{background:#e6dfcd; color:var(--ink)}
nav.tabs button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
nav.tabs .num{opacity:.55; margin-right:5px; font-variant-numeric:tabular-nums}

main{padding:22px 28px 60px; max-width:1500px}
section.view{display:none}
section.view.on{display:block}
.vhead{margin:0 0 14px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start}
.vhead h2{margin:0 0 6px; font-size:19px; font-weight:600; letter-spacing:.06em}
.vhead p{margin:0; color:var(--ink2); font-size:13px; max-width:78ch}
.vhead .tags{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.tag{font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.tag.good{border-color:#8aa88a; color:#3f6b45; background:#f0f5ef}
.tag.bad{border-color:#c9a3a3; color:#8c3b3b; background:#f8f0f0}

.panel{background:#fffdf8; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.panel .bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  padding:9px 14px; border-bottom:1px solid var(--line); background:#faf7ee;
  font-size:12.5px; color:var(--ink2);
}
.panel .bar label{display:flex; align-items:center; gap:6px}
.panel .bar select,.panel .bar input[type=search]{
  font-family:inherit; font-size:12.5px; padding:3px 7px;
  border:1px solid var(--line2); border-radius:5px; background:#fff; color:var(--ink);
}
.panel .bar input[type=range]{width:220px}
.panel .body{overflow:auto; max-height:76vh}
svg.canvas{display:block}
.hint{padding:8px 14px; font-size:11.5px; color:var(--ink2); border-top:1px solid var(--line); background:#faf7ee}

/* 共通の描画要素 */
.node-label{font-size:11px; fill:var(--ink); cursor:pointer}
.node-label:hover{fill:var(--accent); text-decoration:underline}
.link{fill:none; stroke:var(--line2); stroke-width:1}
.axis text{font-size:10px; fill:var(--ink2)}
.axis line{stroke:var(--line); stroke-width:1}
.gridline{stroke:#e7dfcc; stroke-width:1}
.rule{stroke:#b08a6a; stroke-width:1; stroke-dasharray:4 3}
.rule-label{font-size:10px; fill:#8c6a4a}

/* カード */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; padding:14px}
.card{border:1px solid var(--line); border-radius:8px; background:#fff; padding:10px 11px; position:relative; overflow:hidden}
.card .cr{position:absolute; right:-10px; top:-10px; width:76px; height:76px; opacity:.09}
.card .nm{font-size:15px; font-weight:600; letter-spacing:.04em}
.card .nm a{color:inherit; text-decoration:none}
.card .nm a:hover{color:var(--accent); text-decoration:underline}
.card .yr{font-size:11.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
.card .ld{margin-top:6px; display:flex; gap:4px; flex-wrap:wrap}
.chip{font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid currentColor; opacity:.9}

/* 凡例 */
.legend{display:flex; flex-wrap:wrap; gap:10px; padding:9px 14px; border-top:1px solid var(--line); background:#faf7ee; font-size:11.5px}
.legend .it{display:flex; align-items:center; gap:5px; color:var(--ink2)}
.legend .sw{width:11px; height:11px; border-radius:2px}
.legend .cr{width:15px; height:15px}

/* ツールチップ */
#tip{
  position:fixed; pointer-events:none; z-index:99; opacity:0; transition:opacity .1s;
  background:#2b2622; color:#f6f2e8; font-size:12px; line-height:1.55;
  padding:7px 10px; border-radius:6px; max-width:330px; box-shadow:0 6px 20px rgba(0,0,0,.25);
}
#tip b{color:#fff}
#tip .sm{opacity:.75; font-size:11px}

footer{padding:18px 28px 40px; border-top:1px solid var(--line); color:var(--ink2); font-size:11.5px; margin-top:30px}
footer a{color:var(--ink2)}
.warn{background:#fdf6e8; border:1px solid #e0cf9f; border-radius:8px; padding:10px 13px; margin:0 0 14px; font-size:12.5px; color:#6b5a35}
</style>
</head>
