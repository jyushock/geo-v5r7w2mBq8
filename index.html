    <!-- 大容量データ(data/castle/michi/manhole/pokemon/mhcard)は初回描画をブロックしないよう
         スクリプト内で非同期に動的読込する（表示中レイヤー優先＋背景取得）。小さな辞書のみ同期読込。 -->
    <script src="duplicate-stations.js"></script>
    <script src="pref_codes.js"></script>
    <script>
    // 周辺検索のカテゴリアイコンをスプライト(icons-raw.svg)から注入。
    // 注入先(.nearby-cat-icon)はbody内のため、DOM準備を待つ。
    // SWキャッシュで本fetchが即返ってもbody未生成で空振りしないようDOMContentLoadedを待機し、
    // 取得失敗・空振り時はリトライする（iOS等での一時的失敗からの自己復旧）。
    (function loadNearbyCatIcons(retries) {
        fetch('icons-raw.svg?v=20260704-icons').then(r => r.text()).then(svgText => {
            const m = svgText.match(/<g[^>]*>([\s\S]*)<\/g>/);
            if (!m) { if (retries > 0) setTimeout(() => loadNearbyCatIcons(retries - 1), 500); return; }
            const inner = m[1];
            const inject = () => {
                const els = document.querySelectorAll('.nearby-cat-icon[data-vb]');
                if (!els.length) { if (retries > 0) setTimeout(() => loadNearbyCatIcons(retries - 1), 300); return; }
                els.forEach(el => {
                    el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="${el.dataset.vb}"><g fill="currentColor">${inner}</g></svg>`;
                });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inject, { once: true });
            else inject();
        }).catch(() => { if (retries > 0) setTimeout(() => loadNearbyCatIcons(retries - 1), 500); });
    })(3);
    </script>
    <style>
        :root {

           部分実装のため、これだけでは塞ぎ切れない。各ドロワーの非スクロール領域の
           touch-action:none と、スクロール領域の watchScrollerTouchAction と併せて塞ぐ。 */
        html, body { overscroll-behavior: none; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .current-location-dot {
            width: 16px; height: 16px;
            background: #4285F4;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
            position: relative;
            will-change: transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease,
                        border-width 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .current-location-dot::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 32px solid rgba(68, 131, 238, 0.35);
            border-radius: 50%;
            transform-origin: 50% 100%;
            transform: translate(-50%, -100%) rotate(var(--heading, 0deg));
            opacity: 0;
            transition: transform 0.2s ease-out, opacity 0.3s;
            will-change: transform;
        }
        .current-location-dot.heading-active::before { opacity: 1; }
        .current-location-dot::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 16px; height: 16px;
            background: rgba(66, 133, 244, 0.4);
            border-radius: 50%;
            animation: none;
        }
        .current-location-dot.tracking::after {
            animation: gps-pulse 2s ease-out infinite;
        }
        /* ── ナビモード（向き追従）: 白丸＋青矢印 ── */
        .current-location-dot.nav-mode {
            width: 32px; height: 32px;
            background: white;
            border: none;
            box-shadow: 0 3px 14px rgba(0,0,0,0.32);
        }
        .current-location-dot.nav-mode::before {
            width: 21px; height: 21px;
            background: #4285F4;
            clip-path: polygon(50% 0%, 80% 100%, 50% 76%, 20% 100%);
            border-left: none; border-right: none; border-top: none;
            border-radius: 0;
            transform-origin: 50% 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            transition: none;
            opacity: 1;
        }
        .current-location-dot.nav-mode::after { display: none; }
        @keyframes gps-pulse {
            0%   { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
        }
        @keyframes spin {

        }
        @keyframes pinPulse {

            100% { transform: translate(-50%,-50%) scale(4); opacity: 0; }
        }
        .search-pin-pulse {
            position: absolute; top: 0; left: 50%;
            transform: translate(-50%, -50%);

            border-radius: 50%;
            background: rgba(244,67,54,0.4);
            animation: pinPulse 1s ease-out 1;

        }
@keyframes originFlash {

            100% { background: #f9f9f9; }
        }
        #nearby-search-origin.flash { animation: originFlash 0.7s ease-out; }
        /* ズーム＋移動履歴ボタン（縦カプセル） */

        /* カプセル内の各ボタン（＋－の2段に復帰） */

        /* 移動履歴ボタン（目隠し／北リセットと同仕様の丸ボタンとして独立配置） */
        #hist-nav-btn {
            position: fixed;
            right: 10px;
            bottom: 194px; /* ズームカプセル上端(90+96)+8pxのgap */
            z-index: 200;
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #333;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #hist-nav-btn:hover:not(:disabled) { background-color: rgba(255,255,255,1); }
        #hist-nav-btn:active:not(:disabled) { background-color: rgba(180, 180, 180, 0.9); }
        #hist-nav-btn:disabled { color: #c5c5c5; cursor: default; }

        /* 移動履歴リストポップアップ（丸ボタン長押しで表示） */
        #hist-list-popup {
            display: none;
            position: fixed;
            right: 10px;
            bottom: 250px; /* 丸ボタン上端(194+48)+8px */
            z-index: 250;
            width: 220px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            font-family: sans-serif;
        }
        #hist-list-popup .hist-hdr { font-size: 11px; color: #888; font-weight: bold; padding: 8px 12px 4px; }
        #hist-list-popup .hist-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid #f2f2f2; cursor: pointer; }
        #hist-list-popup .hist-item:last-child { border-radius: 0 0 12px 12px; }
        #hist-list-popup .hist-item:hover { background: #f9f9f9; }
        #hist-list-popup .hist-item.hist-cur { background: #f5f8ff; cursor: default; }
        #hist-list-popup .hist-item.hist-future { opacity: 0.55; }
        #hist-list-popup .hist-cur-tag { color: #4285f4; font-weight: normal; }
        #hist-list-popup .hist-ico { font-size: 14px; flex-shrink: 0; }
        #hist-list-popup .hist-ico-type { width: var(--obj-icon-circle); height: var(--obj-icon-circle); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: white; flex-shrink: 0; }
        #hist-list-popup .hist-ico-type img { width: var(--obj-icon-inner); height: var(--obj-icon-inner); object-fit: contain; filter: brightness(0) invert(1); }
        #hist-list-popup .hist-ico-type img.icon-full { width: var(--obj-icon-inner-full); height: var(--obj-icon-inner-full); }

        #hist-list-popup .hist-ico-cause svg { width: var(--obj-icon-inner); height: var(--obj-icon-inner); }
        #hist-list-popup .hist-ico-cause img { width: var(--obj-icon-inner); height: var(--obj-icon-inner); object-fit: contain; }
        #hist-list-popup .hist-ico-mhcard { position: relative; width: var(--mhcard-w); height: var(--mhcard-h); flex-shrink: 0; background: #e2ddd4; border-radius: 6px; overflow: hidden; }
        #hist-list-popup .hist-ico-mhcard-main { width: 100%; height: 100%; object-fit: contain; display: block; }
        #hist-list-popup .hist-ico-mhcard-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: var(--mhcard-badge); height: var(--mhcard-badge); filter: brightness(0) invert(1); pointer-events: none; }
        #hist-list-popup .hist-txt { flex: 1; min-width: 0; }
        #hist-list-popup .hist-name { font-size: 12px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

            background: #fff; transform: rotate(45deg); box-shadow: 3px 3px 6px rgba(0,0,0,0.08);
        }

        }
        #nearby-btn {

        #geolocate-btn {

        /* テキスト表示・メニュー表示のチェックボックス。

        .filter-chip {

        }
        .filter-chip input { width: 11px; height: 11px; margin: 0; }
        /* ══ オブジェクト情報シート（下から出る。旧ポップアップの置き換え） ══
           レイアウト: タイトル行（バッジ左＋名前） / 写真128px＋テキスト横並び / ボタン3行
           ボタン行は flex で等分するため、個数が変わっても空きセルが出ない。

           --sheet-base: 開いているときの bottom。下部バー（検索欄・メニュー）を隠さず、
           その上に載せる（GoogleMapのタブとシートの関係と同じ）。0 でないシートはこれだけで、
           enableSheetSwipeClose と openObjSheet はこの値を読んで引きずり位置を決める。
           値は #bottom-bar の height と揃える。

           max-height: 下部バー52pxに加えて地図を160px残す。160pxは adjustMapForSheet が
           既に使っている「可視域は最低160px残す」と同じ基準。iPhone SE3(667px)で455pxとなり、
           本文が2行clampされた通常時（実測で最大402px）は制限に掛からない。
           clampを展開して超えた分は #obj-sheet-body 側がスクロールする。 */
        #obj-sheet {
            --sheet-base: 52px;
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: #fff; border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.18);
            z-index: 310; transition: bottom 0.28s ease;
            max-height: calc(100svh - var(--sheet-base) - 160px); display: flex; flex-direction: column;
            font-family: sans-serif;
        }
        /* 閉じるボタン(20px)がヘッダー内に収まる高さを確保し、本文と重ならないようにする */
        #obj-sheet-header { position: relative; padding: 8px 14px 4px; min-height: 24px;
                            box-sizing: border-box; flex-shrink: 0; cursor: grab; touch-action: none; }
        #obj-sheet-header .os-handle { width: 36px; height: 4px; background: #ccc; border-radius: 2px; margin: 0 auto; }
        #obj-sheet-close {
            position: absolute; top: 1px; right: 8px;
            background: none; border: none; font-size: 20px; color: #bbb;
            cursor: pointer; padding: 0 6px; line-height: 1;
        }
        /* overscroll-behavior-y: 最上部からさらに下へ引いたとき、スクロールを外側へ波及させない。
           下スワイプで閉じる判定（enableSheetSwipeClose）をブラウザのオーバースクロールに奪われないため。 */
        #obj-sheet-body { overflow-y: auto; overscroll-behavior-y: contain; touch-action: pan-y; padding: 0 14px 14px; }   /* 内容幅 = 画面幅 - 28px */
        .os-title { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; min-width: 0; }
        /* タイトルの上に独立して置くバッジ（食べログの部門）。名前の左に置くと店名が押されるため */
        .os-badge-row { display: flex; gap: 5px; margin-bottom: 3px; }
        /* 長い名前（食べログの店名など）は2行で省略する */
        .os-name { font-size: 15px; font-weight: bold; min-width: 0; overflow: hidden;
                   display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .os-row { display: flex; gap: 10px; margin-top: 5px; align-items: flex-start; }
        .os-meta { flex: 1; min-width: 0; }
        /* 写真: 幅128pxの枠。既定は128×128にcover（旧 .castle-img と同じトリミング方式） */
        .os-photo { width: 128px; height: 128px; flex-shrink: 0; border-radius: 7px; border: 1px solid #eee;
                    overflow: hidden; background: #f2f0ec; }
        .os-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        /* マンホールカードは縦長（実測 232×320 / 517×722 ＝ 約1:1.39）で、正方形枠にcoverすると
           上下が切れてしまう。カード系は高さを画像の比率なりに伸ばして全体を見せる。 */
        .os-photo.os-photo-full { height: auto; }
        .os-photo.os-photo-full img { height: auto; object-fit: contain; }
        /* 城の写真は取得元がいずれも横長（攻城団パノラマ 720×240 / 城郭放浪記 640×427〜480 /
           Wikipedia 400×300 など）。高さは128pxのまま枠を4:3(171×128)に広げると、
           城郭放浪記とWikipediaの横長画像はほぼ切れずに収まる（4:3ちょうどの640×480は全体が入る）。
           行の高さはテキスト側（最大約96px）より写真が高いままなのでシート高は変わらない。 */
        .os-photo.os-photo-wide { width: 171px; }
        /* 城の写真は非同期取得。取得できるまで（できなかった場合も）場所を取らない */
        .os-castle-photo { display: none; }
        /* 写真がタップで拡大できることを示す目印。
           position:relative が無いと ::after の位置の基準が #obj-sheet(position:fixed)になり、
           写真の右下ではなくシートの右下＝ボタン行の上に出てしまう（実測で確認）。 */
        .os-photo { cursor: zoom-in; position: relative; }
        .os-photo::after {
            content: '⤢'; position: absolute; right: 3px; bottom: 3px;
            width: 18px; height: 18px; border-radius: 4px; background: rgba(0,0,0,0.5);
            color: #fff; font-size: 11px; line-height: 18px; text-align: center; pointer-events: none;
        }
        /* ══ 写真の全画面ビューア ══════════════════════════════════════
           トラック（出典間の横移動）と内側要素（ズーム／パン）で transform の役割を
           2階層に分け、出典スワイプ中の変形とズームが混ざらないようにする。
           ビューポートが user-scalable=no のためブラウザのピンチが効かず、拡大は自前で行う。 */
        #photo-viewer { position: fixed; inset: 0; z-index: 9000; display: none; touch-action: none; }
        #photo-viewer.open { display: block; }
        #pv-backdrop { position: absolute; inset: 0; background: #000; }
        #pv-track { position: absolute; inset: 0; display: flex; }
        /* 写真の置き場は情報帯の上までとし、帯を写真に重ねない。
           マンホールカードは画像そのものに説明文が刷られており（gk-p.jp の実物は 517×722。
           iPhone SE3 の幅375pxでは 375×523.7 に縮むので、画面高667でも下端が情報帯へ62px、
           Safariのバーが出る高さ553では119px食い込む）、重ねると説明が読めなくなる。
           ポケふた(750×750)も高さ553では45px食い込むため、種別を問わず余白を取る。
           帯の高さは名前・住所の行数で変わるので pvSyncInfoHeight() が実測して --pv-info-h に入れる。
           下限100pxは出典ドット(bottom:92px＋直径6px)を写真にかけないための分。
           拡大中や情報帯を畳んだ間もこの余白は残す。写真の位置が操作のたびに動く方が読みづらいため。 */
        #pv-track .pv-pane { width: 100%; height: 100%; flex-shrink: 0; box-sizing: border-box;
                             padding-bottom: max(var(--pv-info-h, 134px), 100px);
                             display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #pv-track .pv-inner { width: 100%; height: 100%; display: flex;
                              align-items: center; justify-content: center; transform-origin: center center; }
        /* 等倍を超えて引き伸ばさない。低解像度の取得元（蓋のカード 232×320）をぼかさないため。
           スマホは画像より画面が小さく常に縮小がかかるので、この上限は実質効かない。 */
        #pv-track img { max-width: 100%; max-height: 100%; object-fit: contain; display: block;
                        user-select: none; -webkit-user-drag: none; }
        /* PC等の広い画面では、上の上限により画像が原寸のまま中央に置かれ黒く余る
           （1920×1080で最大91.7%が黒）。広い画面に限り画面に合わせて拡大する。
           object-fit:contain なので拡大しても比率は維持される。
           768px 未満（スマホ）には一切影響しない。
           なお暗幕(#pv-backdrop)を半透明にして圧迫感を抑える案も試したが、
           背後の情報シートのボタンやサムネイルが透けて情報帯の文字と重なり
           読めなくなるため採らない（実測確認済み）。暗幕は不透明のままにする。 */
        @media (min-width: 768px) {
            #pv-track img { width: 100%; height: 100%; max-width: none; max-height: none; }
        }
        #pv-info {

        .os-line { font-size: 11px; color: #333; line-height: 1.45; font-variant-numeric: tabular-nums; }
        .os-line + .os-line { margin-top: 1px; }
        /* メタ行の項目ラベル。全種別を同じ白抜きチップに統一する（以前はコロン・
           os-kタグ・絵文字・ラベルなしの4系統が混在していた）。
           枠線や影を付けると1行あたり1px背が伸びてシートが高くなるので、下地だけで表現する。
           グレージュの下地に濃い文字（sheet-tag-darktext-preview.html のN8）。以前の白抜き
           （#a8a294 に白）は文字とのコントラストが2.54:1しかなく、同じ行の本文
           （#333／白地＝12.63:1）に対して極端に薄かった。9.5pxはWCAGの「大きい文字」に
           当たらないため基準は4.5:1で、この配色は8.40:1。
           文字は #3d3d3d。真っ黒に寄せるとラベルだけが本文(#333)より強く見えるので、
           本文よりわずかに薄いところまで下げている。
           下地は白地との差が1.29:1。これ以上明るくするとチップの輪郭が地の白に溶けて
           タグに見えなくなる（いずれも計算で確認）。 */
        .os-line .os-k { display: inline-block; background: #E6E2D8; color: #3d3d3d; border-radius: 3px;
                         font-size: 9.5px; font-weight: 700; line-height: 1.5; padding: 0 4px;
                         margin-right: 4px; vertical-align: 1px; letter-spacing: 0.8px; }
        .os-clamp { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .os-clamp.clampable { cursor: pointer; }
        .os-clamp.clampable::after { content: ' ▼'; font-size: 10px; color: #999; }
        .os-clamp.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
        .os-clamp.clampable.expanded::after { content: ' ▲'; }

        /* マンホール系のカードID／弾バッジ。位置(タイトル左)と寸法は城の形態バッジと同一に揃える。 */
        .os-cdbadge { font-size: 12px; font-weight: 700; color: #fff;
                      padding: 2px 8px; border-radius: 10px; line-height: 1.6;

        /* 「第◯弾」は隣のカードIDバッジ(#8d6e63)と別系統の紫にする。白文字とのコントラストは
           6.85:1（計算で確認）。もとは #546E7A だったが、メタ行の項目ラベルを同じ色にした際に

           （#CCDEEA）に変えたので色の重複自体は解消しているが、明度が大きく離れていて
           タイトル行のバッジとメタ行の役割の違いが出るため、この紫のままにしている。
           城郭放浪記ボタン(btn-shirohb)と同じ色だが、あれは城のシートにしか出ないので、
           このバッジと同じ画面に並ぶことはない。 */
        .os-cdbadge.os-cdround { background: #6A4C93; }
        /* 100名城・続100名城の印。形態バッジの右に並べる。寸法は形態バッジと同一で、
           色は地図のピン・検索結果と同じものを getItemColor から取って直接指定する。 */
        .os-genrebadge { font-size: 12px; font-weight: 700; color: #fff;
                         padding: 2px 8px; border-radius: 10px; line-height: 1.6;

        /* 形態名ごとの個別色。平城系(平城・平山城)は緑系、水系(水軍城・海城・水城)は青系、寺社は紫系に統一。

        .popup-form-badge.f-yamajiro   { background: hsl(0,   42%, 38%); } /* 山城 */

        .popup-form-badge.f-gakebata   { background: hsl(340, 32%, 36%); } /* 崖端城 */
        .popup-form-badge.f-suigun     { background: hsl(205, 40%, 36%); } /* 水軍城（青系） */
        .popup-form-badge.f-kango      { background: hsl(250, 28%, 40%); } /* 環濠 */
        .popup-form-badge.f-daijiro    { background: hsl(310, 28%, 38%); } /* 台城 */
        .popup-form-badge.f-umijiro    { background: hsl(218, 40%, 38%); } /* 海城（青系） */
        .popup-form-badge.f-jisha      { background: hsl(280, 35%, 40%); } /* 寺社（紫系） */

        .nearby-list-btns .nearby-list-btn { margin-bottom: 0; }
        .nearby-list-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%;
            background: #f8f8f8; border: 0; border-radius: 10px; padding: 8px 6px;
            cursor: pointer; font-family: inherit;
        }
        .nearby-list-btn:disabled { opacity: 0.5; cursor: default; }
        .nlb-ic {
            width: 34px; height: 34px; border-radius: 9px; background: #546E7A;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        /* お城アイコンは枠いっぱいに描く。他の場所（地図・検索結果・周辺検索・履歴）でも
           マンホール以外は比率100%（--obj-icon-inner-full と --obj-icon-circle が同値）のため */
        .nlb-ic img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1); }
        /* SVGで描く入口アイコン（都道府県）。図形側に余白を持たせてあるので枠いっぱいに置く */
        .nlb-ic svg { width: 100%; height: 100%; display: block; }
        /* 文字の主張は周辺検索のカテゴリラベル（.nearby-cat-label）に合わせる。
           同じ列に並ぶ要素なので、太字や濃い色にすると入口だけが浮く。 */
        .nlb-n { display: block; font-size: 9px; color: #555; text-align: center;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        /* 城主一覧ビュー（メニューパネル内の第3・第4ビュー） */
        #nearby-lords-view, #nearby-lord-detail-view {
            display: none; flex-direction: column; min-height: 0;
            height: calc(100svh - 104px); max-height: 100%;   /* 下部バー52px＋上に残す地図52px */
        }
        #nearby-lords-view.open, #nearby-lord-detail-view.open { display: flex; }
        /* 都道府県ビュー（第5・第6）。城主ビューと同じ枠組みを使う */
        #nearby-pref-view, #nearby-pref-detail-view {
            display: none; flex-direction: column; min-height: 0;
            height: calc(100svh - 104px); max-height: 100%;   /* 下部バー52px＋上に残す地図52px */
        }
        #nearby-pref-view.open, #nearby-pref-detail-view.open { display: flex; }
        /* 遺構ビュー（第7〜9）。城主・都道府県と同じ枠組みを使う */
        #nearby-remains-view, #nearby-remains-group-view, #nearby-remains-detail-view {
            display: none; flex-direction: column; min-height: 0;
            height: calc(100svh - 104px); max-height: 100%;   /* 下部バー52px＋上に残す地図52px */
        }
        #nearby-remains-view.open, #nearby-remains-group-view.open,
        #nearby-remains-detail-view.open { display: flex; }
        /* ══ 県ページの絞り込み（集計帯を直接押す） ═══════════════════════
           集計帯の種別を押すと表示・非表示が切り替わる。外した種別はグレーに落とす。
           食べログだけは長押しでジャンル行（部門35種）が開く（地図の長押しと同じ500ms）。 */
        .pref-sum-item { cursor: pointer; padding: 3px 5px 4px; border-radius: 9px;
                         -webkit-tap-highlight-color: transparent; }
        .pref-sum-item.off { filter: grayscale(1); opacity: .34; }
        /* 集計帯のタップで飛んだ先の行。最大の県では2,000行を超えて動くので、
           着いた場所が分かるように一瞬光らせる（prefJumpToType） */
        @keyframes prefJumped { from { background: #fff59d; } to { background: transparent; } }
        .pref-jumped { animation: prefJumped 1.1s ease-out; }
        /* 食べログのジャンル行。バッジと同じ10グループの区分で並べ、
           選んでいるチップはバッジと同じ色にする（一覧の色と一致させるため） */
        #pref-genre-line:empty { display: none; }
        .pref-gline { padding: 6px 13px 8px; border-bottom: 1px solid #f0f0f0; }
        .pref-gline-h { font-size: 11px; color: #888; margin-bottom: 5px;
                        display: flex; align-items: center; gap: 8px; }
        .pref-gline-h b { color: #b26a00; }
        /* 部門の「全解除／全選択」。見た目は絞り込み帯の「すべて表示」（.pref-rstbar button）と揃える */
        .ptg-all { margin-left: auto; border: 0; background: #f2f2f2; border-radius: 12px;
                   padding: 3px 10px; font-size: 11px; color: #2a5bd7; font-weight: bold;
                   cursor: pointer; font-family: inherit; flex-shrink: 0; }
        .pref-ggrp { margin-bottom: 6px; }
        .pref-ggrp:last-child { margin-bottom: 0; }
        .pref-ggname { font-size: 10px; color: #9aa4ad; margin-bottom: 3px; }
        .pref-gchips { display: flex; flex-wrap: wrap; gap: 5px; }
        .ptg { font-size: 11px; padding: 4px 9px; border-radius: 13px; background: #f2f2f2;
               color: #666; border: 0; cursor: pointer; font-family: inherit; }
        .ptg.on { color: #fff; font-weight: bold; }
        .ptg-n { opacity: .6; margin-left: 3px; font-size: 10px; }
        /* 絞り込み中だけ出す帯。今どれだけ絞られているかと、戻す操作をここにまとめる */
        #pref-reset-bar:empty { display: none; }
        .pref-rstbar { display: flex; align-items: center; gap: 8px; padding: 6px 13px;
                       background: #fff8e1; border-bottom: 1px solid #f0e2b8;
                       font-size: 11.5px; color: #8a6d1a; }
        .pref-rstbar button { margin-left: auto; border: 0; background: #fff; border-radius: 12px;
                              padding: 3px 10px; font-size: 11px; color: #2a5bd7; font-weight: bold;
                              cursor: pointer; font-family: inherit; flex-shrink: 0; }
        /* 地方の見出し。スクロールしても頭に残す。
           中身は地方名だけ。件数は各行の内訳と県ページ側にあるので、ここには置かない */
        .reg-head {
            position: sticky; top: 0; background: #f7f9fa; padding: 6px 13px;
            font-size: 11px; font-weight: bold; color: #546E7A;
            border-bottom: 1px solid #eceff1;
            z-index: 2;
        }
        /* 県の行。県名のアイコンは置かない（県名を示す有効な絵が無く、頭文字だけではノイズになるため） */
        .pref-row { display: flex; align-items: center; gap: 9px; padding: 11px 13px;
                    border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .pref-row:active { background: #f7f9ff; }
        /* 県の行に出す種別ごとの件数。アイコンは県ページの集計帯と同じ prefTypeIconHtml を使い、
           寸法だけ CSS 変数の上書きで小さくする（マークアップは共通のまま）。
           数字の欄は種別ごとに固定幅なので、アイコンが全行で同じ位置に来る。
           iPhone SE3（375px）で6種別すべて出しても県名は切れない。 */
        /* 県名の欄は固定幅にする。flex: 1 のままだと画面が広いPCでは県名の欄だけが伸びて、
           件数が県名から遠く離れた右端に飛ばされる。幅は4文字の県名（神奈川県・和歌山県・
           鹿児島県）の実測54pxに余白を足した値。件数の側に margin-right: auto を置くので、
           余った幅は件数と「›」の間に入り、「›」は今までどおり行の右端に残る。 */
        .pref-row .lord-main { flex: 0 0 auto; width: 56px; }
        /* 全国の行だけ県名の欄を固定幅にしない。「全国」は2文字で済む一方、件数は県より桁が多く
           （6種別で合わせて9ch多い）、56px のままだと行の幅が385px必要になって
           375px では「›」が画面の外へ出るため（実測）。名前の欄を詰めるとちょうど収まる。 */
        .pref-row.pref-row-all .lord-main { width: auto; }
        /* 名前の欄を詰めるだけでは375pxで残りが6pxしかなく、端末によるフォントの幅の差で
           「›」が画面の外へ出る。全国の行だけ間隔も詰めて30px弱の余りを作る。
           アイコンと数字は他の行と同じ寸法のまま（詰めるのは隙間だけ）。
           それでも収まらない端末のために、描いたあとに実測して縮める（fitPrefAllRow）。 */
        .pref-row.pref-row-all { gap: 6px; }
        .pref-row.pref-row-all .pref-cnt-line { gap: 3px; }
        .pref-row.pref-row-all .pref-cnt-cell { gap: 0; }
        .pref-cnt-line {
            display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 11px;
            margin-right: auto;
            --obj-icon-circle: 15px; --obj-icon-inner: 13.4px; --obj-icon-inner-full: 15px;
            --mhcard-w: 14px; --mhcard-h: 18px; --mhcard-badge: 11.2px; --mhcard-radius: 3px;
        }
        .pref-cnt-cell { display: flex; align-items: center; gap: 1px; }
        .pref-cnt-n { display: inline-block; color: #546E7A; font-weight: bold;
                      font-variant-numeric: tabular-nums; }
        .pref-cnt-n.zero { color: #cfd8dc; }
        /* 県詳細の集計帯。種別ごとにオブジェクトのアイコンと件数を並べる */
        .pref-sum { padding: 9px 13px; background: #f7f9fa; border-bottom: 1px solid #f0f0f0;
                    flex-shrink: 0; touch-action: none; }
        /* アイコンは種別で縦横比が違う（カード配布だけ縦長のカード画像）。
           数字の位置を揃えるため、アイコンは元の寸法のまま列の高さだけを合わせて下端に寄せる。
           アイコン自身に height を掛けると丸アイコンが縦に伸びるので触らない。 */
        .pref-sum-line { display: flex; gap: 12px; justify-content: space-between;
                         align-items: flex-end; min-height: calc(var(--mhcard-h) + 20px); }
        .pref-sum-item { display: flex; flex-direction: column; align-items: center;
                         justify-content: flex-end; text-align: center; }
        .pref-sum-v { font-size: 13px; font-weight: bold; color: #546E7A; margin-top: 3px; }
        /* 0件の種別。周辺検索の結果は圏内に何があるか次第で0件の種別が出るので、
           アイコンは出したまま数字だけ淡くする（都道府県一覧の .pref-cnt-n.zero と同じ色）。
           県ページの集計帯は0件の種別を並べないので、この状態にはならない。 */
        .pref-sum-v.zero { color: #cfd8dc; }
        /* 一覧の行に出すバッジ。情報シートの os-genrebadge / popup-form-badge / os-cdbadge と同じ見た目を小さくしたもの */
        .pref-badges { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; flex-shrink: 0; }
        /* 寸法だけ一覧用に小さくし、色はシート側の定義（popup-form-badge の f-* / os-cdbadge）に任せる。
           popup-form-badge と併記したときにこちらの font-size / padding が効くよう後に置く。 */
        .pref-badge { font-size: 9.5px; font-weight: 700; color: #fff; padding: 1px 7px;
                      border-radius: 9px; white-space: nowrap; line-height: 1.5; }
        .pref-badge.card { background: #8d6e63; }
        .pref-badge.round { background: #6A4C93; }

        /* 遺構から探す（第7〜9ビュー）。行の作りは城主・都道府県と同じで、
           グループ行だけ種別アイコンと同じ28pxの丸に記号を白抜きで置く。 */
        .rg-ic { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
                 display: flex; align-items: center; justify-content: center; }
        .rg-ic svg { width: 19px; height: 19px; display: block; }
        /* 個別の遺構の行。グループ行（.lord-row）より一段控えめにする */
        .rt-row { display: flex; align-items: center; gap: 9px; padding: 9px 13px;
                  border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .rt-row:active { background: #f7f9ff; }
        .rt-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
        .rt-name { font-size: 12.5px; color: #333; flex: 1; min-width: 0;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rt-g { font-size: 10px; color: #aaa; flex-shrink: 0; }
        .rt-num { font-size: 11.5px; color: #546E7A; font-weight: bold; flex-shrink: 0; }
        /* 中分類の行の右端に切り出す「内訳」ボタン。行本体はその中分類の城一覧へ行くので、
           1つ下の階層（小分類）へ降りる操作はここに分ける。長押しのような隠し操作にせず、
           何が起きるかをボタンの文字（内訳68種）に出す */
        .rt-drill { display: flex; align-items: center; gap: 3px; flex-shrink: 0;
                    border: 1px solid #dbe6ff; background: #f3f6ff; color: #2a5bd7;
                    border-radius: 13px; padding: 4px 8px 4px 9px; font-size: 10.5px;
                    font-family: inherit; cursor: pointer; }
        .rt-drill:active { background: #e3ecff; }
        /* グループの城をまとめて見る行（第8ビューの先頭）。情報シートの戻り導線
           （.os-lords-back）と同じ配色にして、遷移する行だと分かるようにする */
        .rt-all { display: flex; align-items: center; gap: 8px; padding: 10px 13px;
                  background: #f3f6ff; border-bottom: 1px solid #dbe6ff; color: #2a5bd7;
                  font-size: 12px; font-weight: bold; cursor: pointer; flex-shrink: 0; }

        /* 城主ビューの見出し・絞り込み帯もスクロールしない領域。素通しさせない */
        .lords-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; flex-shrink: 0; touch-action: none; }
        .lords-head-title { font-size: 14px; font-weight: bold; color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lords-iconbtn {
            width: 32px; height: 32px; border: 0; background: #f5f5f5; border-radius: 8px;
            color: #555; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .lords-filter { padding: 0 12px 8px; flex-shrink: 0; border-bottom: 1px solid #f0f0f0; touch-action: none; }
        .lords-filter input {
            width: 100%; height: 34px; border: 1px solid #e3e3e3; border-radius: 17px;
            padding: 0 12px; font-size: 13px; font-family: inherit; background: #fafafa; color: #333;
        }
        /* 絞り込み欄のクリアボタン。メイン画面の #search-clear と同じ振る舞いで、
           入力があるときだけ出す。type=search の既定ボタンは二重になるので消す。 */
        .lords-search-wrap { position: relative; }
        .lords-search-wrap input { padding-right: 34px; }
        .lords-search-wrap input::-webkit-search-cancel-button { display: none; }
        .lords-search-clear {
            display: none; position: absolute; right: 2px; top: 0; height: 34px;
            background: none; border: 0; font-size: 18px; color: #9E9E9E;
            cursor: pointer; padding: 0 10px; font-family: inherit;
        }
        .lords-search-wrap.has-text .lords-search-clear { display: block; }
        .lords-chips { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
        .lords-chip {
            font-size: 11px; padding: 4px 10px; border-radius: 14px; background: #f2f2f2;
            color: #666; border: 0; cursor: pointer; font-family: inherit;
        }
        .lords-chip[aria-pressed="true"] { background: #e3ecff; color: #2a5bd7; font-weight: bold; }
        /* 近い順の起点。「どこからの距離なのか」を一覧の直前に帯で出す。
           帯は一覧のスクロール領域（.lords-scroll）の外にあるので、一覧をどれだけ
           送っても出たまま残る（貼り付ける指定は要らない）。
           起点は検索ピンがあればそこ、無ければ地図の中心（getSearchCenter）で、
           どちらなのかはアイコンで描き分ける。文字はその地名だけにして、
           何の値なのかはアイコンに語らせる。並び順に関わらず常に出す。
           色は上の集計帯（.pref-sum）と同じ #f7f9fa に揃える。 */
        .dorg { display: flex; align-items: center; gap: 6px; padding: 6px 13px;
                background: #f7f9fa; border-bottom: 1px solid #f0f0f0;
                font-size: 11px; flex-shrink: 0; touch-action: none; }
        .dorg:empty { display: none; }
        .dorg b { color: #455a64; font-weight: 600; flex: 1; min-width: 0;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 起点が今の地図の中心とずれているときだけ出す取り直しの導線。
           一覧からオブジェクトを開いて戻ると、地図はそこへ寄ったまま起点は前のところに
           残るので、その場で今の位置に合わせ直せるようにする。
           見た目は絞り込み帯の「すべて表示」（.pref-rstbar button）と揃える。 */
        .dorg button { border: 0; background: #fff; border-radius: 12px; padding: 3px 10px;
                       font-size: 10.5px; color: #2a5bd7; font-weight: bold;
                       cursor: pointer; font-family: inherit; flex-shrink: 0; }
        .lords-scroll { overflow-y: auto; overscroll-behavior-y: contain; touch-action: pan-y; flex: 1; min-height: 0; }

        /* ══ 件数の多い一覧のスクロールバー ═══════════════════════════════
           指でつまんで動かせるように太くする。対象は行数が数百〜1万件規模になり得る
           一覧（城主・都道府県・県ページ・周辺検索・検索結果・種別シート）。
           情報シート本体やメニューのカテゴリ面は行数が知れているので触らない。
           つまみに最低の高さを与えているのは、1万件を超える城主一覧だと
           高さ比だけでは数pxになって掴めなくなるため。
           iOS Safari / Chrome とも ::-webkit-scrollbar を指定すると重ね表示をやめて
           常時表示の細帯になる。Firefox は scrollbar-width で太くはできないので
           既定（auto）のまま。 */
        .lords-scroll::-webkit-scrollbar,
        #nearby-list::-webkit-scrollbar,
        #search-results-inner::-webkit-scrollbar { width: 13px; }
        .lords-scroll::-webkit-scrollbar-track,
        #nearby-list::-webkit-scrollbar-track,
        #search-results-inner::-webkit-scrollbar-track { background: transparent; }
        .lords-scroll::-webkit-scrollbar-thumb,
        #nearby-list::-webkit-scrollbar-thumb,
        #search-results-inner::-webkit-scrollbar-thumb {
            background: #b7c3cf; border-radius: 7px; min-height: 44px;
            border: 3px solid transparent; background-clip: padding-box;
        }
        .lords-scroll::-webkit-scrollbar-thumb:active,
        #nearby-list::-webkit-scrollbar-thumb:active,
        #search-results-inner::-webkit-scrollbar-thumb:active { background: #8fa1b3; }
        .lord-row { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .lord-row:active { background: #f7f9ff; }
        .lord-main { flex: 1; min-width: 0; }
        .lord-name { font-size: 13.5px; font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lord-sub { font-size: 10.5px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lord-num { font-size: 12px; color: #546E7A; font-weight: bold; flex-shrink: 0; }
        .lord-chev { color: #ccc; font-size: 15px; flex-shrink: 0; }
        .lords-note { padding: 16px; text-align: center; color: #999; font-size: 13px; }
        /* 一覧を上限で打ち切ったときの「さらに◯件」。
           見た目は絞り込み帯の「すべて表示」（.pref-rstbar button）と揃える */
        .pref-more { display: block; margin: 9px auto 0; border: 0; background: #f2f2f2;
                     border-radius: 12px; padding: 5px 14px; font-size: 12px; color: #2a5bd7;
                     font-weight: bold; cursor: pointer; font-family: inherit; }
        /* 城の情報シートに出す「城主一覧に戻る」導線 */
        .os-lords-back {
            display: flex; align-items: center; gap: 6px; margin: 0 0 8px; padding: 7px 10px;
            background: #f3f6ff; border: 1px solid #dbe6ff; border-radius: 9px;
            font-size: 11.5px; color: #2a5bd7; cursor: pointer;
        }
        /* フッターは #nearby-panel-scroll の外側にある兄弟要素で、本文の
           overscroll-behavior が掛からない。ここ起点の下スワイプが素通しで
           ドキュメントに届いていたため touch-action: none で塞ぐ。 */
        #nearby-panel-footer {
            display: flex;
            align-items: stretch;
            min-height: 52px;
            touch-action: none;
            position: sticky;
            bottom: 0;
            background: white;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
        }
        #nearby-search-origin {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 7px;
            background: #f9f9f9;
            border-right: 1px solid #e0e0e0;
            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
        }
        #nearby-search-origin.expanded { align-items: flex-start; padding-top: 10px; padding-bottom: 10px; }
        #nearby-search-origin.expanded #nearby-search-origin-text-wrap { overflow: visible; }
        #nearby-search-origin-icon { flex-shrink: 0; display: flex; align-items: center; }
        #nearby-search-origin-label { font-size: 10px; color: #aaa; line-height: 1.2; }
        #nearby-search-origin-text { font-size: 13px; color: #333; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

        /* カードは可変幅（最大86px）。降水量表示を含む「92% 2.7mm」等が

        #weather-widget { display: flex; flex: 1 1 auto; min-width: 0; max-width: 266px; gap: 4px; }

        /* 降水確率（案B: アイコン+気温の下に水滴+数字を中央寄せ・確率で色分け） */

        /* オブジェクト表示。都道府県から探すの集計帯（.pref-sum-item）と同じ扱いにする。
           押して出し入れし、外した種別はグレーに落とす。文字のチェックボックスは使わない。
           形は周辺検索のカテゴリ（.nearby-cat-item）と同じアイコン上・名前下の縦積みで、
           6種別を横一列に並べる。SE3(375px)で1列53.8pxとなり、9pxの名前は
           「マンホールカード配布」を2行に折り返せば全種別が収まる（実測）。

        #obj-filter-list {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 4px;
            padding: 0 16px 8px;
        }
        .objf-item {

        /* アイコンは種別で縦横比が違う（カード配布だけ縦長のカード画像）。
           枠の高さを縦長のほうに合わせて固定し、名前の出る位置を6列で揃える。

        .objf-ic { height: var(--mhcard-h); display: flex; align-items: center; }
        /* 文字の主張は周辺検索のカテゴリラベル（.nearby-cat-label）に合わせる。

        .objf-n { font-size: 9px; line-height: 1.3; color: #555; text-align: center;
                  max-width: 100%; }
        #nearby-list {
            overflow-y: auto;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }
        .nearby-item {

            align-items: center;

            gap: 10px;
        }

        .nearby-item-icon {
            width: var(--obj-icon-circle); height: var(--obj-icon-circle);
            border-radius: 50%;

            overflow: hidden;

        .nearby-item-icon img { width: var(--obj-icon-inner); height: var(--obj-icon-inner); object-fit: contain; filter: brightness(0) invert(1); }
        .search-result-icon img { width: var(--obj-icon-inner); height: var(--obj-icon-inner); object-fit: contain; filter: brightness(0) invert(1); }
        .nearby-item-icon img.icon-full, .search-result-icon img.icon-full { width: var(--obj-icon-inner-full); height: var(--obj-icon-inner-full); }
        .nearby-item-text { flex: 1; min-width: 0; }

        /* パネルの外側（地図の上）を覆う透明レイヤー。タップで閉じるだけの層なので、
           ここでのスワイプはブラウザに渡さない（渡すとiOSがドキュメントごとバウンスする）。 */
        #nearby-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 299;
            touch-action: none;
        }

<script>
    // ── 天気ウィジェット（スクリプト先頭で初期化）──────────────────
    // WMOコード → スタンプアイコンのファイル名（weather-icons/stamp/＜名前＞.png）
    var WMO_ICON = {
        0:'clear-day', 1:'partly-cloudy-day', 2:'cloudy', 3:'overcast-day',
        45:'fog', 48:'fog',
        51:'drizzle', 53:'drizzle', 55:'drizzle', 56:'drizzle', 57:'drizzle',
        61:'rain', 63:'rain', 65:'rain', 66:'rain', 67:'rain',
        71:'snow', 73:'snow', 75:'snow', 77:'snow',
        80:'partly-cloudy-day-rain', 81:'partly-cloudy-day-rain', 82:'partly-cloudy-day-rain',
        85:'partly-cloudy-day-snow', 86:'partly-cloudy-day-snow',
        95:'thunderstorms-day-rain', 96:'thunderstorms-day-rain', 99:'thunderstorms-day-rain',
    };
    // アイコン名 → 天気別カラー（CSS maskのbackground-colorに使用）
    var WMO_COLOR = {
        'clear-day':'#FB8C00', 'partly-cloudy-day':'#F59E0B', 'cloudy':'#607D8B', 'overcast-day':'#546E7A',
        'fog':'#78909C', 'drizzle':'#0288D1', 'rain':'#1976D2', 'partly-cloudy-day-rain':'#1E88E5',
        'snow':'#0097A7', 'partly-cloudy-day-snow':'#26A69A', 'thunderstorms-day-rain':'#5E35B1',
    };
    var weatherCache = null;
    var weatherCacheTime = 0;
    var weatherCacheLat = null;
    var weatherCacheLng = null;
    var selectedWeatherDayIndex = null;
    var WEATHER_CACHE_TTL = 10 * 60 * 1000;

    // ── 大容量データの非同期ローダ ─────────────────────────────────
    // data/castle/michi/manhole/pokemon/mhcard はここで動的に読み込む。
    // 各データ到着時に対応する地図ソースを埋め、検索インデックスを再構築する。
    // 表示中レイヤーを優先し、残りは背景で逐次取得（全件検索を維持）。
    const EMPTY_FC = { type: 'FeatureCollection', features: [] };
    const FAMOUS_GENRES = new Set(['日本100名城', '続日本100名城']);
    const loadedData = Object.create(null); // key -> FeatureCollection

    function loadScriptOnce(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src; s.async = true;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error('load failed: ' + src));
            document.head.appendChild(s);
        });
    }

    function setSourceData(id, fc) {
        const src = map.getSource(id);
        if (src) src.setData(fc);
    }

    /* 食べログの部門・ポケふたは、レイヤーの visibility では出し入れできない。
       どちらもソースの中の一部（部門／source:'pokefuta'）だけを消す話で、
       shops と manholes は cluster:true のためクラスタの件数がソース側で決まるからで、
       レイヤーに filter を掛けても丸の中の数字は絞る前のままになる。
       そこで、表示設定を反映した features をソースへ入れ直す。
       件数は食べログ7,077・マンホール1,267・ポケふた482で、入れ直しは一瞬で済む。 */
    function shopFeaturesForMap() {
        const fc = loadedData.shops;
        if (!fc) return EMPTY_FC;
        if (!genreOff.size) return fc;   // 絞っていないときは元の配列をそのまま渡す
        return { type: 'FeatureCollection',
                 features: fc.features.filter(f => genreVisible(shopGenreBase(f.properties.category))) };
    }
    function manholeFeaturesForMap() {
        // 蓋とポケふたは1つのソースに同居している。ポケふたは source:'pokefuta' で見分ける
        const mh = (filterState.manhole !== false && loadedData.manhole) ? loadedData.manhole.features : [];
        const pk = (filterState.pokefuta !== false && loadedData.pokefuta)
            ? loadedData.pokefuta.features.map(f => ({ ...f, properties: { ...f.properties, source: 'pokefuta' } })) : [];
        return { type: 'FeatureCollection', features: [...mh, ...pk] };
    }
    function refreshShopSource()    { setSourceData('shops',    shopFeaturesForMap()); }
    function refreshManholeSource() { setSourceData('manholes', manholeFeaturesForMap()); }

    // 各データ到着時にソースへ反映（manholeは2データの合成、castleは2分割）
    function applyDataset(key) {
        if (key === 'michi')  setSourceData('michi',   loadedData.michi);
        if (key === 'shops')  refreshShopSource();
        if (key === 'mhcard') setSourceData('mhcards', loadedData.mhcard);
        if (key === 'castle' && loadedData.castle) {
            const feats = loadedData.castle.features;
            setSourceData('castles-famous', { type: 'FeatureCollection', features: feats.filter(f => FAMOUS_GENRES.has(f.properties.genre)) });
            setSourceData('castles',        { type: 'FeatureCollection', features: feats.filter(f => !FAMOUS_GENRES.has(f.properties.genre)) });
            lordIndex = null;        // 城データが入れ替わったら城主索引は作り直す
            updateLordsEntry();
            remainsIndex = null;     // 遺構索引も同じ理由で作り直す
            remainsGroups = null;
            updateRemainsEntry();
        }
        if (key === 'manhole' || key === 'pokefuta') refreshManholeSource();
        buildSearchIndex(); // 到着済みデータで全件検索を再構築
        prefIndex = null;   // 都道府県索引は searchIndex から組むので作り直させる
        objGenreCounts = null;   // 部門の件数も searchIndex から数えるので数え直させる
        updatePrefEntry();
        // 設定を開いたまま食べログが届いたときのために、開いていれば描き直す
        if (document.getElementById('nearby-settings-view').classList.contains('open')) renderObjFilterUI();
    }

    // 表示中レイヤーを優先して逐次ロード（パースのジャンクを抑えるため直列）
    function startDataLoading() {
        // 並びは種別の共通順（食べログ→ポケふた→マンホール→カード配布→道の駅→城）。
        // 下の sort は安定なので、表示中グループ・非表示グループそれぞれの中では
        // この順のまま読む。地図のピンの重なり順（configs）とは別物で揃える必要はない
        const specs = [
            { key: 'shops',    src: 'data.js',    get: () => shopData,          vis: filterState.shop    !== false },
            { key: 'pokefuta', src: 'pokemon.js', get: () => pokefutaGeoJSON,   vis: filterState.pokefuta !== false },
            { key: 'manhole',  src: 'manhole.js', get: () => manholeGeoJSON,    vis: filterState.manhole !== false },
            { key: 'mhcard',   src: 'mhcard.js',  get: () => mhcardGeoJSON,     vis: filterState.mhcard  !== false },
            { key: 'michi',    src: 'michi.js',   get: () => michiNoEkiGeoJSON, vis: filterState.michi   !== false },
            { key: 'castle',   src: 'castle.js',  get: () => castleData,        vis: filterState.castle  !== false },
        ];
        specs.sort((a, b) => (b.vis ? 1 : 0) - (a.vis ? 1 : 0)); // 表示中を先頭へ
        let chain = Promise.resolve();
        specs.forEach(spec => {
            chain = chain.then(() => loadScriptOnce(spec.src)
                .then(() => { loadedData[spec.key] = spec.get(); applyDataset(spec.key); })
                .catch(e => console.warn('[data]', spec.src, e)));
        });
    }

    const savedState = (() => {
        try { return JSON.parse(localStorage.getItem('mapState')); } catch { return null; }
    })();

    const savedSettings = (() => {
        try { return JSON.parse(localStorage.getItem('settingsState')); } catch { return null; }
    })();

    const mapTileSource = localStorage.getItem('mapTileSource') || 'openfreemap';
    const mapStyle = mapTileSource === 'osm'
        ? { version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf', sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' } }, layers: [{ id: 'osm-tiles', type: 'raster', source: 'osm' }] }
        : 'https://tiles.openfreemap.org/styles/liberty';
    const map = new maplibregl.Map({
        container: 'map',
        style: mapStyle,
        center:  savedState ? [savedState.lng, savedState.lat] : [139.76, 35.68],
        zoom:    savedState ? savedState.zoom    : 11,
        bearing: savedState ? savedState.bearing : 0,
        pitch:   savedState ? savedState.pitch   : 0,
        attributionControl: false
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    // ダブルタップズームをアニメーション付きに統一（iOS対応）
    // デフォルトのdoubleClickZoomを無効化し、touchend自前検出＋dblclickの両方でeaseTo
    map.doubleClickZoom.disable();
    let lastTapTime = 0;
    let lastTapLngLat = null;
    map.getCanvas().addEventListener('touchend', (e) => {
        if (e.touches.length !== 0) return;
        if (e.changedTouches.length !== 1) return;
        const now = Date.now();
        const dt = now - lastTapTime;
        if (dt < 300 && dt > 30 && lastTapLngLat) {
            e.preventDefault();
            map.easeTo({
                zoom: map.getZoom() + 1,
                center: lastTapLngLat,
                duration: 300,
                essential: true
            });
            lastTapTime = 0;
            lastTapLngLat = null;
        } else {
            lastTapTime = now;
            const touch = e.changedTouches[0];
            lastTapLngLat = map.unproject([touch.clientX, touch.clientY]);
        }
    }, { passive: false });
    // Android・PC向けにdblclickも対応
    map.on('dblclick', (e) => {
        e.preventDefault();
        map.easeTo({
            zoom: map.getZoom() + 1,
            center: e.lngLat,
            duration: 300,
            essential: true
        });
    });

    // --- 移動履歴（戻る/進む） ---
    const HIST_MAX = 50;
    const mapHistory = [];
    let histIndex = -1;
    let histPending = null;    // プログラム移動の直後のmoveendで記録するラベル
    let histNavActive = false; // 履歴ジャンプによる移動中はmoveendで記録しない
    let histNavTimer = null;

    // moveend不発（同一地点への移動等）で残った古いpendingを次のmoveendに誤適用しないよう時刻を持つ
    // extra: 記録時に一緒に残す情報（ピン選択の objType / objProps）。省略時は従来どおり
    function histSetPending(label, cause, extra) {
        histPending = { label, cause, extra: extra || null, t: Date.now() };
    }

    function histPush(info) {
        const c = map.getCenter();
        const entry = Object.assign({ lng: c.lng, lat: c.lat, zoom: map.getZoom(), time: Date.now() }, info);
        // 直前エントリと同じ操作・同じラベル・ほぼ同位置なら上書き（連打による重複防止）
        const cur = mapHistory[histIndex];
        if (cur && cur.cause === entry.cause && cur.label === entry.label) {
            const p1 = map.project([cur.lng, cur.lat]);
            const p2 = map.project([entry.lng, entry.lat]);
            if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 40) {
                Object.assign(cur, entry);
                updateHistButtons();
                return;
            }
        }
        mapHistory.splice(histIndex + 1); // 進む側の履歴は破棄
        mapHistory.push(entry);
        if (mapHistory.length > HIST_MAX) mapHistory.shift();
        histIndex = mapHistory.length - 1;
        updateHistButtons();
    }

    // ピンタップ時：直前エントリとほぼ同位置ならラベルを引き継いで上書き、離れていれば新規追加
    function histRecordPin(label, coords, objType, objProps) {
        const cur = mapHistory[histIndex];
        if (cur) {
            const p1 = map.project([cur.lng, cur.lat]);
            const p2 = map.project(coords);
            if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 40) {
                // zoom も更新する。上書き元のズームを残すと、この履歴に戻ったとき
                // タップした時ではなく以前のズームに戻ってしまう。
                Object.assign(cur, { label, cause: 'pin', lng: coords[0], lat: coords[1], zoom: map.getZoom(), time: Date.now(), objType, objProps });
                delete cur.addr; // ピン名で表示するため取得済み住所を破棄
                return;
            }
        }
        histPush({ label, cause: 'pin', lng: coords[0], lat: coords[1], objType, objProps });
    }

    // 手動移動：直前エントリから画面短辺の40%以上動いたら記録（現在地追従中は記録しない）
    function histCheckManualMove() {
        if (trackingMode > 0) return;
        const cur = mapHistory[histIndex];
        if (!cur) return;
        const c = map.getCenter();
        const p1 = map.project([cur.lng, cur.lat]);
        const p2 = map.project([c.lng, c.lat]);
        if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < Math.min(window.innerWidth, window.innerHeight) * 0.4) return;
        // 15秒以内に続く手動移動は直近エントリを更新（細かい移動での履歴増殖を防ぐ）
        if (cur.cause === 'move' && Date.now() - cur.time < 15000 && histIndex === mapHistory.length - 1) {
            Object.assign(cur, { lng: c.lng, lat: c.lat, zoom: map.getZoom(), time: Date.now() });
            delete cur.addr; // 位置が変わったので取得済み住所を無効化
            return;
        }
        histPush({ label: '地図移動', cause: 'move' });
    }

    function onHistMoveEnd(ev) {
        // 情報シートを開いたときの寄せ直し（adjustMapForSheet）は利用者の移動操作ではないので
        // 履歴に残さない。ここで弾かないと、シートが大きいときに寄せ量が
        // histCheckManualMove のしきい値を超え、「地図移動」が積まれて進む側の履歴が消える。
        if (ev && ev.histIgnore) return;
        if (histNavActive) {
            histNavActive = false;
            clearTimeout(histNavTimer);
            updateHistButtons();
            return;
        }
        if (histPending) {
            const p = histPending;
            histPending = null;
            if (Date.now() - p.t < 3000) {
                histPush(Object.assign({ label: p.label, cause: p.cause }, p.extra || {}));
                return;
            }
        }
        histCheckManualMove();
    }

    // ボタン自体は「前後どちらにも移動先が無い」時だけ無効化。
    // タップ動作（戻る）はhistIndex<=0の時にhistGoTo側でno-opになるだけで、
    // 「進むだけ可能」な状態でも長押しで履歴を開けるようにする。
    function updateHistButtons() {
        document.getElementById('hist-nav-btn').disabled = mapHistory.length <= 1;
    }

    let histSheetHandler = null;   // 履歴移動の完了後に情報シートを開くための moveend ハンドラ

    function histGoTo(idx) {
        if (idx < 0 || idx >= mapHistory.length || idx === histIndex) return;
        closeHistList();
        if (trackingMode > 0) { trackingMode = 0; stopRafLoop(); updateGeolocateButton(); }
        const e = mapHistory[idx];
        histIndex = idx;
        histPending = null;
        histNavActive = true;
        clearTimeout(histNavTimer);
        histNavTimer = setTimeout(() => { histNavActive = false; }, 1500); // moveend不発時の保険
        updateHistButtons();

        // 連続で履歴移動したとき、前回の予約が残って別地点のシートが開かないようにする
        if (histSheetHandler) { map.off('moveend', histSheetHandler); histSheetHandler = null; }
        closeObjSheet();   // 移動先と無関係なシートを残さない

        // オブジェクトの履歴に戻るときは、タップした時と同じ状態（情報シート＋選択リング）へ戻す。
        // 移動の完了後に開くのは、openObjSheet 内の adjustMapForSheet がシート高さぶん
        // 寄せ直すため。寄せ直しはズームを変えないので、下で合わせる e.zoom が保たれる。
        // 登録を easeTo より先に行うのは、既に目的地にいる等で moveend が
        // easeTo の呼び出し中に同期発火しても取りこぼさないようにするため。
        if (e.cause === 'pin' && e.objType && e.objProps) {
            const handler = () => {
                map.off('moveend', handler);
                if (histSheetHandler === handler) histSheetHandler = null;
                openObjSheet(e.objType, e.label, e.objProps, e.lng, e.lat);
            };
            histSheetHandler = handler;
            map.on('moveend', handler);
        }
        map.easeTo({ center: [e.lng, e.lat], zoom: e.zoom, bearing: 0, pitch: 0, duration: 550, essential: true });
    }

    const HIST_CAUSES = { init: '開始地点', search: '検索', pin: 'ピン選択', geo: '現在地', move: '地図移動' };

    // init/search/move用の線画アイコン（丸背景＋白線で種別色ピン(hist-ico-type)と統一）
    const HIST_ICON_SVG = {
        // 丸背景(直径28px)に載るため、viewBox中心からの最遠距離(ストローク込み)が
        // 丸半径の88%になるよう座標を揃えてある。外接矩形ではなく最遠距離で揃えるのは、
        // 円の中では縁までの余白が見た目を決めるため。init は元から87.9%で調整不要。
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.11" cy="10.11" r="5.67"/><line x1="14.12" y1="14.12" x2="19.55" y2="19.55"/></svg>',
        move:   '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1.07" x2="12" y2="22.93"/><line x1="1.07" y1="12" x2="22.93" y2="12"/><polyline points="7.63 5.44 12 1.07 16.37 5.44"/><polyline points="7.63 18.56 12 22.93 16.37 18.56"/><polyline points="5.44 7.63 1.07 12 5.44 16.37"/><polyline points="18.56 7.63 22.93 12 18.56 16.37"/></svg>',
        init:   '<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#fff"><line x1="6" y1="3" x2="6" y2="21" stroke-width="2"/><path d="M6 4 L18 4 L14 8 L18 12 L6 12 Z"/></svg>',
    };
    const HIST_ICON_COLOR = { search: '#4285F4', move: '#F4B400', init: '#00796B' };
    // geo（現在地）は地図長押しピン設置（search-pin-icon）と同じマーカーSVGを流用
    const HIST_GEO_PIN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 36"><path d="M14 0C7.4 0 2 5.4 2 12c0 8.4 12 24 12 24s12-15.6 12-24C26 5.4 20.6 0 14 0z" fill="#F44336"/><circle cx="14" cy="12" r="5" fill="white" opacity="0.9"/></svg>';

    // ピン選択エントリはオブジェクト種別ごとのアイコン（検索結果ドロップダウンと同じ画像）を優先表示
    function histIconHtml(e) {
        const cfg = e.cause === 'pin' && e.objType ? typeConfig[e.objType] : null;
        if (!cfg) {
            if (e.cause === 'geo') return `<div class="hist-ico-cause" style="background:#fce8e6;"><img src="data:image/svg+xml;utf8,${encodeURIComponent(HIST_GEO_PIN_SVG)}"></div>`;
            const svg = HIST_ICON_SVG[e.cause];
            if (svg) return `<div class="hist-ico-cause" style="background:${HIST_ICON_COLOR[e.cause]}">${svg}</div>`;
            return `<span class="hist-ico">📍</span>`;
        }
        if (e.objType === 'mhcard') {
            return `<div class="hist-ico-mhcard"><img class="hist-ico-mhcard-main" src="mhcard.png"><img class="hist-ico-mhcard-overlay" src="manhole.png"></div>`;
        }
        const color = getItemColor({ type: e.objType, properties: e.objProps || {} });
        return `<div class="hist-ico-type" style="background:${color}">${cfg.img ? `<img src="${cfg.img}"${cfg.img === 'manhole.png' ? '' : ' class="icon-full"'}>` : cfg.icon}</div>`;
    }

    function histTimeAgo(t) {
        const s = (Date.now() - t) / 1000;
        if (s < 60) return 'たった今';
        if (s < 3600) return `${Math.floor(s / 60)}分前`;
        if (s < 86400) return `${Math.floor(s / 3600)}時間前`;
        return `${Math.floor(s / 86400)}日前`;
    }

    function histEscape(s) {
        return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // 現在地点を境に、上＝戻れる場所（直近優先）／下＝進める場所（direct順）を1つのリストに統合表示
    function openHistList() {
        if (mapHistory.length <= 1) return;
        const BEFORE = 6, AFTER = 4;
        const start = Math.max(0, histIndex - BEFORE);
        const end = Math.min(mapHistory.length - 1, histIndex + AFTER);
        const visible = [];
        for (let idx = end; idx >= start; idx--) visible.push({ e: mapHistory[idx], idx });

        const pop = document.getElementById('hist-list-popup');
        pop.innerHTML = `<div class="hist-hdr">移動履歴</div>` + visible.map(({ e, idx }) => {
            const isCur = idx === histIndex;
            const cls = isCur ? ' hist-cur' : (idx > histIndex ? ' hist-future' : '');
            const curTag = isCur ? ' <span class="hist-cur-tag">● 現在地点</span>' : '';
            return `<div class="hist-item${cls}" data-idx="${idx}">${histIconHtml(e)}<div class="hist-txt"><div class="hist-name">${histEscape(e.addr || e.label)}${curTag}</div><div class="hist-meta">${histTimeAgo(e.time)}・${HIST_CAUSES[e.cause] || ''}</div></div></div>`;
        }).join('');
        pop.style.display = 'block';
        histFetchAddrs(visible.map(v => v.e));
    }

    // 「地図移動」エントリの住所をリスト表示時に遅延取得してキャッシュ
    // Nominatim利用規約（最大1リクエスト/秒）に合わせて逐次・間隔付きで取得する
    let histAddrFetching = false;
    async function histFetchAddrs(entries) {
        if (histAddrFetching) return;
        const targets = entries.filter(e => e.cause === 'move' && !e.addr);
        if (!targets.length) return;
        histAddrFetching = true;
        try {
            for (let i = 0; i < targets.length; i++) {
                const e = targets[i];
                const t0 = Date.now();
                const addr = await fetchPlaceName(e.lat, e.lng);
                if (addr && !e.addr) {
                    e.addr = addr;
                    // ポップアップが開いたままならその行だけ書き換える
                    const idx = mapHistory.indexOf(e);
                    const pop = document.getElementById('hist-list-popup');
                    if (pop.style.display === 'block' && idx >= 0) {
                        const nameEl = pop.querySelector(`.hist-item[data-idx="${idx}"] .hist-name`);
                        if (nameEl) nameEl.textContent = addr;
                    }
                }
                if (i < targets.length - 1) {
                    await new Promise(r => setTimeout(r, Math.max(0, 1000 - (Date.now() - t0))));
                }
            }
        } finally {
            histAddrFetching = false;
        }
    }

    function closeHistList() {
        document.getElementById('hist-list-popup').style.display = 'none';
    }

    // 中央ボタン：タップでひとつ前に戻る、長押し(500ms)で移動履歴リスト
    function setupHistButton(btnId) {
        const btn = document.getElementById(btnId);
        let timer = null;
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (btn.disabled) return;
            timer = setTimeout(() => { timer = null; openHistList(); }, 500);
        });
        btn.addEventListener('pointerup', () => {
            if (timer) { clearTimeout(timer); timer = null; histGoTo(histIndex - 1); }
        });
        const cancelPress = () => { clearTimeout(timer); timer = null; };
        btn.addEventListener('pointerleave', cancelPress);
        btn.addEventListener('pointercancel', cancelPress);

// --- スムージング用変数 ---
let currentSmoothedHeading = null;
const smoothingFactor = 0.03; // センサー入力の平滑化（小さいほど滑らか）

// 角度の差分を-180〜180の範囲で計算するヘルパー（最短距離で回転させるため）
function getShortestAngleDiff(current, target) {
    let diff = target - current;
    while (diff < -180) diff += 360;
    while (diff > 180) diff -= 360;
    return diff;
}

// handleOrientation: 信頼できるabsolute系イベントのみ使用
// absolute=falseのdeviceorientationは端末起動時基準のため180度ずれが起きるので無視
function handleOrientation(event) {
    let rawHeading = null;

    if (event.webkitCompassHeading !== undefined) {
        // iOS: webkitCompassHeading は真北基準で信頼性が高い
        rawHeading = event.webkitCompassHeading;

    } else if (event.type === 'deviceorientationabsolute' && event.alpha !== null) {
        // Android: absolute版は地磁気北基準なので信頼できる
        rawHeading = (360 - event.alpha) % 360;

    } else if (event.type === 'deviceorientation' && event.absolute === true && event.alpha !== null) {
        // absolute=trueのdeviceorientationも同等
        rawHeading = (360 - event.alpha) % 360;

    } else {
        // absolute=false のdeviceorientationは信頼できないため無視
        return;
    }

    // 画面の向き（縦・横）を補正
    let screenAngle = 0;
    if (window.screen && window.screen.orientation) {
        screenAngle = window.screen.orientation.angle;
    } else if (typeof window.orientation === 'number') {
        screenAngle = window.orientation;
    }

    const targetHeading = (rawHeading + screenAngle + 360) % 360;

    if (currentSmoothedHeading === null) {
        currentSmoothedHeading = targetHeading;
    } else {
        const diff = getShortestAngleDiff(currentSmoothedHeading, targetHeading);
        // 差分が0.1度以下なら完全に収束させて微小振動を止める
        if (Math.abs(diff) < 0.1) {
            currentSmoothedHeading = targetHeading;
        } else {
            currentSmoothedHeading = (currentSmoothedHeading + diff * smoothingFactor + 360) % 360;
        }
    }

    deviceHeading = currentSmoothedHeading;
    // 扇アイコンの更新はrAFループに一本化（ここでは行わない）
}

// --- 城写真取得（攻城団→城郭放浪記→Wikipedia フォールバック、キャッシュ付き） ---
const castleImgCache = {};

// 画像URLが実在するかを<img>読み込みの成否で判定する（Promise化）。
// 城郭放浪記(hb.pei.jp)はAccess-Control-Allow-Originを返さないため、
// 攻城団のようなfetch()+blob()方式は使えない(CORSエラーで常に失敗する。実測確認済み)。
// <img>の読み込みはCORS不要で、成功時はそのURLがHTTPキャッシュに乗るため
// (ETag/Last-Modifiedのみでmax-ageは無いが、ブラウザの既定動作でキャッシュされる)、
// 後で同じURLをポップアップに挿入する際に再利用される。
function checkImageLoads(url, timeoutMs = 8000) {
    return new Promise((resolve) => {
        const img = new Image();
        let done = false;
        const finish = (ok) => { if (!done) { done = true; resolve(ok); } };
        img.onload = () => finish(true);
        img.onerror = () => finish(false);
        img.src = url;
        setTimeout(() => finish(false), timeoutMs);
    });
}

// 攻城団: URLから城IDを抽出してパノラマ画像URLを構築
// HEADでの事前存在確認は廃止し、画像GET自体を存在確認に使う
// (攻城団へのリクエストを成功時2回→1回に削減。GETした画像は
//  Cache-Control: max-age=7日でHTTPキャッシュされ、表示時に再利用される)。
// 存在判定はfetchのステータスで行う。<img>のonerrorは使えない:
// このサーバは404応答の本文にもJPEG(エラー画像)を返し、Chromeは
// その場合loadイベントを発火するため誤って表示してしまう(実測確認済み)。
// CORSはAccess-Control-Allow-Origin:*を確認済み。
async function castleImgFromKojodan(kojodanUrl) {
    if (!kojodanUrl) return null;
    const m = kojodanUrl.match(/kojodan\.jp\/castle\/(\d+)/);
    if (!m) return null;
    const imgUrl = `https://kojodan.com/pic/panorama/${m[1]}.jpg`;
    try {
        const res = await fetch(imgUrl);
        if (res.ok) {
            await res.blob(); // ダウンロードを完了させHTTPキャッシュに乗せる
            return imgUrl;
        }
    } catch (_) {}
    return null;
}

// 城郭放浪記: 個別ページURL(shiroHbUrl)配下の indexb.jpg が写真ページの規約的な命名
// (実測確認済み。城郭放浪記は個人運営サイトのため、タップ時1回のみのアクセスに留める)
async function castleImgFromShiroHb(shiroHbUrl) {
    if (!shiroHbUrl) return null;
    const imgUrl = `${shiroHbUrl}indexb.jpg`;
    return (await checkImageLoads(imgUrl)) ? imgUrl : null;
}

// Wikipedia: ja.wikipedia.org の pageimages API（CORS許可: origin=*）
// 公式ドキュメント: https://www.mediawiki.org/wiki/Extension:PageImages
// size はサムネイルの最大幅。シート表示は400、拡大表示は CASTLE_ZOOM_THUMB を使う。
async function castleImgFromWikipedia(castleName, size) {
    try {
        const apiUrl = `https://ja.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=${size}&titles=${encodeURIComponent(castleName)}&format=json&origin=*`;
        const res = await fetch(apiUrl);
        const data = await res.json();
        const page = Object.values(data.query.pages)[0];
        if (page && page.thumbnail && page.thumbnail.source) return page.thumbnail.source;
    } catch (_) {}
    return null;
}

async function fetchCastleImage(castleName, kojodanUrl, shiroHbUrl) {
    const cacheKey = castleName;
    if (castleImgCache[cacheKey] !== undefined) return castleImgCache[cacheKey];
    // 先に見つかった時点で打ち切る（攻城団・城郭放浪記へのアクセスを増やさないため）
    let url = await castleImgFromKojodan(kojodanUrl);
    if (!url) url = await castleImgFromShiroHb(shiroHbUrl);
    if (!url) url = await castleImgFromWikipedia(castleName, 400);
    castleImgCache[cacheKey] = url;   // どこからも取得できなければ null
    return url;
}

// 拡大表示用に、シート表示では打ち切っていた残りの取得元も調べて配列にする。
// 写真を拡大したときだけ呼ぶので、通常の閲覧でアクセスが増えることはない。
// Wikipediaはシート用の400pxではなく拡大に耐える幅で取り直す
// (pithumbsize=1200 で 1200×800 が返ることを実測確認済み。原寸は4200×2800)。
const CASTLE_ZOOM_THUMB = 1200;
const castleImgAllCache = {};
async function fetchCastleImagesAll(castleName, kojodanUrl, shiroHbUrl) {
    if (castleImgAllCache[castleName]) return castleImgAllCache[castleName];
    const [ko, sh, wp] = await Promise.all([
        castleImgFromKojodan(kojodanUrl),
        castleImgFromShiroHb(shiroHbUrl),
        castleImgFromWikipedia(castleName, CASTLE_ZOOM_THUMB),
    ]);
    const list = [];
    if (ko) list.push({ url: ko, label: '攻城団' });
    if (sh) list.push({ url: sh, label: '城郭放浪記' });
    if (wp) list.push({ url: wp, label: 'Wikipedia' });
    castleImgAllCache[castleName] = list;
    return list;
}

// --- Wikipedia記事の存在確認（キャッシュ付き） ---
// name単独だとWikipediaの正式タイトルと不一致で誤って「記事なし」判定になるケースがあるため
// （例:「上之国館」はmissingだが、aliases由来の「上之国勝山館跡」はリダイレクトで実在記事「勝山館」に解決）、
// name + aliasesを候補としてtitlesに一括指定し、redirects=1でリダイレクトも解決した上で判定する。
//
// 名前だけでは同名の無関係な記事（例: 茨城の館山城 vs 千葉の館山城）にヒットしうるため、
// prop=coordinatesで記事側の座標も取得し、城のcastle.js側座標(lat/lng)と突き合わせる
// (2026-07-24追加。閾値5kmはGetTabelog側の別名同定処理と同じ基準に合わせた)。
// 座標が近い候補があれば最優先で採用する。座標情報がない記事（Infoboxに座標テンプレート
// が無いケース）は判定不能なので、ボタンを消さない方針（誤って開かれるより出ないことを
// 避ける、というユーザー判断）によりフォールバック候補として保持し、座標一致が
// 無ければ採用する。座標はあるが閾値を超えて離れている記事は明確に無関係と判断し除外する。
//
// 【重要】候補(pages)はcandidatesの順序ではなく、APIレスポンスのpages連想配列のキー(pageid)
// 順に返ってくる。JSではObject.values()で整数キーは数値昇順に自動ソートされるため、
// 例えば千葉の佐貫城(aliases:「亀城」「亀ヶ城」)では、aliasesが全く無関係な記事
// （亀城→中国の「亀城市」、亀ヶ城→福島の「猪苗代城」）にリダイレクトされてしまっており、
// かつそれらの記事にも座標情報が無いため、pageid最小の「猪苗代城」が本来の「佐貫城」より
// 先にフォールバック採用され、無関係なページに遷移する実害を確認した(2026-07-24)。
// candidates配列の順序（castleName自身を最優先、aliasesは補完）通りに評価するよう、
// redirectsマッピングでcandidateごとの解決先ページを個別に引いてから順序を組み直す。
const wikiExistsCache = {};
const WIKI_COORD_MATCH_THRESHOLD_KM = 5;

async function resolveWikipediaTitle(castleName, aliases, lat, lng) {
    // 座標を判定に使うため、キャッシュキーにも座標を含める。座標なしで同名の城が
    // 複数箇所にある場合（例:「堀城」）、名前だけをキーにすると片方の判定結果が
    // 無関係な別の場所の同名城にも誤って適用されてしまうため。
    const cacheKey = (typeof lat === 'number' && typeof lng === 'number')
        ? `${castleName}:${lat.toFixed(4)}:${lng.toFixed(4)}` : castleName;
    if (wikiExistsCache[cacheKey] !== undefined) return wikiExistsCache[cacheKey];
    try {
        const candidates = [castleName, ...(Array.isArray(aliases) ? aliases : [])].slice(0, 10);
        // prop=pageprops&ppprop=disambiguation: 別名が曖昧さ回避ページ（例:「朝倉城」は
        // 兵庫・高知の同名城への入口ページで、それ自体は特定の城の記事ではない）に
        // ヒットするケースを除外するため(2026-07-24追加、実データ確認: 保々西城→朝倉城)。
        // 曖昧さ回避ページは記事本文がなく座標情報も持たないため、座標なしフォールバック
        // 採用ロジックに紛れ込むと無関係なページへ誤誘導してしまう。
        const apiUrl = `https://ja.wikipedia.org/w/api.php?action=query&format=json&redirects=1&prop=coordinates|pageprops&ppprop=disambiguation&titles=${encodeURIComponent(candidates.join('|'))}&origin=*`;
        const res = await fetch(apiUrl);
        const data = await res.json();

        // candidate(元の表記) → 実際に解決されたページタイトル、のマッピングを作る
        const redirectMap = {};
        (data.query.redirects || []).forEach(r => { redirectMap[r.from] = r.to; });
        const pagesByTitle = {};
        Object.values(data.query.pages || {}).forEach(pg => {
            const isDisambiguation = pg.pageprops && pg.pageprops.disambiguation !== undefined;
            if (pg.pageid !== undefined && pg.missing === undefined && !isDisambiguation) pagesByTitle[pg.title] = pg;
        });

        // candidatesの順序（castleName最優先）通りに解決済みページを並べ直す（重複除去）
        const orderedPages = [];
        const seenPageIds = new Set();
        for (const cand of candidates) {
            const resolvedTitle = redirectMap[cand] || cand;
            const pg = pagesByTitle[resolvedTitle];
            if (pg && !seenPageIds.has(pg.pageid)) { orderedPages.push(pg); seenPageIds.add(pg.pageid); }
        }

        let result = null;
        const hasCoord = typeof lat === 'number' && typeof lng === 'number';
        if (hasCoord) {
            let fallback = null;
            for (const pg of orderedPages) {
                const pc = pg.coordinates && pg.coordinates[0];
                if (pc) {
                    const d = calcDist(lat, lng, pc.lat, pc.lon);
                    if (d <= WIKI_COORD_MATCH_THRESHOLD_KM) { result = pg.title; break; }
                    // 座標があるが閾値超え: 無関係と判断し不採用（何もしない）
                } else if (fallback === null) {
                    fallback = pg.title; // 座標なし: 判定不能なのでフォールバック候補として保持
                }
            }
            if (result === null) result = fallback;
        } else {
            // 呼び出し側で座標が渡せない場合は従来通り名前一致のみで判定
            result = orderedPages.length > 0 ? orderedPages[0].title : null;
        }

        wikiExistsCache[cacheKey] = result;
        return result;
    } catch (_) {
        // 判定不能時はボタンを消さない（安全側）。キャッシュもしない（次回再試行させる）
        return castleName;
    }
}

// 城シートの情報源セット行（Wikipedia・攻城団・城郭放浪記）を非同期で確定させる。
// 攻城団・城郭放浪記はHTML生成時点でp.url/p.shiroHbUrlの有無から確定済み（暫定レイアウト済み）だが、
// Wikipediaは記事存在確認が非同期のため、確定後にセット行全体をbuildSourceButtons()で再構築する。
async function injectWikiButtonState(castleName, aliases, kojodanUrl, shirohbUrl, lat, lng) {
    const slot = document.querySelector('#obj-sheet-body .os-source-row');
    if (!slot) return;
    const resolvedTitle = await resolveWikipediaTitle(castleName, osParseAliases(aliases), lat, lng);
    const wikiHref = resolvedTitle ? `https://ja.wikipedia.org/wiki/${encodeURIComponent(resolvedTitle)}` : '';
    // 取得完了までに別のオブジェクトへ切り替わっていたら書き換えない
    const cur = document.querySelector('#obj-sheet-body .os-source-row');
    if (cur !== slot) return;
    slot.innerHTML = buildSourceButtons(wikiHref, kojodanUrl, shirohbUrl);
    // ボタン数の増減で高さが変わるため選択ピンの見え方を補正し直す
    adjustMapForSheet();
}
