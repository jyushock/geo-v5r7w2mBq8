<style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fff; }
    header { padding: 12px 14px 8px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .lead { font-size: 12px; color: #555; line-height: 1.7; margin: 0 0 10px; }
    .lead code { background: #f2f2f2; padding: 1px 4px; border-radius: 3px; font-size: 11px; }

    /* 案の切り替えチップ */
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip { font-size: 12px; padding: 5px 10px; border: 1px solid #ccc; background: #fff;
            border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .chip.on { background: #263238; color: #fff; border-color: #263238; }
    .chip.base { border-style: dashed; }

    /* 地図まわりのコントロール */

           padding: 0 14px 8px; }
    .bar .grp { display: flex; gap: 5px; align-items: center; }
    .bar button { font-size: 11.5px; padding: 4px 9px; border: 1px solid #ccc; background: #fff;
                  border-radius: 6px; cursor: pointer; }
    .bar button.on { background: #455A64; color: #fff; border-color: #455A64; }

    #map { width: 100%; height: 56vh; min-height: 340px; }

    /* 選択中の案の解説 */
    .desc { padding: 10px 14px 4px; }
    .desc h2 { font-size: 14px; margin: 0 0 6px; }
    .desc p { font-size: 12.5px; line-height: 1.75; margin: 0 0 8px; color: #333; }
    .desc .pros { color: #1B5E20; }
    .desc .cons { color: #B71C1C; }
    .desc pre { background: #f6f7f9; border-left: 3px solid #90A4AE; padding: 8px 10px; margin: 0 0 8px;
                font-size: 11px; line-height: 1.6; overflow-x: auto; font-family: ui-monospace, monospace; }
    .kv { font-size: 11.5px; color: #555; line-height: 1.7; }
    .kv b { color: #333; }

    table { border-collapse: collapse; width: calc(100% - 28px); margin: 10px 14px 40px; font-size: 12px; }
    th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; vertical-align: top; line-height: 1.6; }
    th { background: #f6f7f9; font-weight: 600; white-space: nowrap; }
    td.cost { white-space: nowrap; }
    h2.sec { font-size: 14px; margin: 24px 14px 6px; padding-bottom: 5px; border-bottom: 1px solid #ddd; }

<body>

<header>
    <h1>ピンの強調方法 — 白フチの代替案</h1>
    <p class="lead">
        現状は全ピンが <code>circle-stroke-width: 3 / circle-stroke-color: '#FFFFFF'</code> の白フチで地図から浮かせている
        （道の駅は一回り大きい白い板、マンホールカードは白フチ込みの画像）。
        白フチは白い建物・白い道路・白い注記の上で境界が消える、密集すると白が面になって地図が読めなくなる、という弱点がある。
        下のチップで案を切り替えると、同じ地点・同じピン配置で見た目が入れ替わる。
    </p>
    <div class="chips" id="chips"></div>
</header>

<div class="bar">
    <div class="grp"><span>地点:</span><span id="places"></span></div>
    <div class="grp"><span>タイル:</span><span id="tiles"></span></div>
    <div class="grp"><span>傾き:</span><span id="pitches"></span></div>
</div>

<div id="map"></div>

<div class="desc">
    <h2 id="d-title"></h2>
    <p id="d-aim"></p>
    <p class="pros" id="d-pro"></p>
    <p class="cons" id="d-con"></p>
    <pre id="d-code"></pre>
    <div class="kv" id="d-scope"></div>
</div>

/* 地色を暗くした「濃色フチ」用の色。HSLの明度を55%に落として彩度は保つ */
function darken(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
    return '#' + [r, g, b].map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');
}

Object.keys(TYPES).forEach(t => DARK_EDGE[t] = darken(TYPES[t].color, 0.52));

    aim: '影を画面ではなく地面に貼り付ける（circle-pitch-alignment を map にする）。傾けると影が地面に沿って潰れ、ピンだけが立つ。',
    pro: '3D傾斜（このアプリは pitch を持つ）で、ピンが地面から生えているように見え、どの地点を指しているかが分かりやすい。',
    con: '傾けていない（pitch 0）ときは①とほぼ同じで、追加分の効果が無い。上のバーで傾きを60°にすると差が出る。',
    code: `paint: { 'circle-radius': 18, 'circle-color': '#000',\n         'circle-blur': 0.6, 'circle-opacity': 0.3,\n         'circle-pitch-alignment': 'map' }`,
    cost: '小', asset: '同上',
},
{
    key: 'teardrop', name: '⑧ 涙型ピン（先端が座標）',
    spec: { teardrop: true, plateEdge: '#FFFFFF' },
    aim: '丸をやめ、下が尖った雫形にして先端を実座標に合わせる。フチは白のまま、影を添える。',
    pro: '「どの点を指しているか」が丸より正確に伝わる。縦に伸びるので横方向の密集に強く、重なっても先端が見える。',
    con: '全種別のピン画像を作り直す必要がある（丸・角丸四角・カードの3系統を1系統に統一するか、涙型に載せ替えるか）。縦に34→44pxと背が高くなり、ラベルの置き場が変わる。クラスタの丸との差が大きくなる。',
    code: `// 円レイヤーをやめ、涙型を描いたPNG（種別色ごと）を\n// icon-anchor: 'bottom' の symbol レイヤーで置く`,
    cost: '大（レイヤー構成の変更）', asset: '種別ごとに涙型PNGが要る',
},
{
    key: 'selective', name: '⑨ 通常は控えめ・選択時だけ強く',
    spec: { stroke: { color: '#FFFFFF', width: 1.5 }, shadow: { r: R + 1, blur: 0.5, opacity: 0.26, dy: 1.5 }, plateEdge: '#FFFFFF', selectOnly: true },
    aim: '強調の総量を減らす方向。通常のピンは白フチ1.5px＋弱い影まで落とし、タップした1件だけ二重リングと脈動で強く出す（中央の100名城が選択中）。',
    pro: '画面全体が静かになり、地図が読める。選択したものが本当に目立つ（今は全部が強調されているので、選択リングの効きが相対的に弱い）。',
    con: 'ピンを探している段階（選択前）の視認性は下がる。密集地でどれが何か分かりにくくなる可能性がある。',
    code: `// 通常\n'circle-stroke-width': 1.5\n// 選択時は既存の selected-ring-inner / -outer に加え\n// circle-radius を rAF で 23→30 に脈動させる`,
    cost: '中（選択リングの演出を足す）', asset: '不要',
},
];

/* ───────── 地点とタイル ───────── */
const PLACES = [
    { name: '渋谷（白い建物・道路が多い）', c: [139.7006, 35.6595], z: 16.4 },
    { name: '皇居まわり（緑地）',           c: [139.7540, 35.6870], z: 16.0 },
    { name: 'みなとみらい（水際）',         c: [139.6355, 35.4560], z: 15.6 },
    { name: '郊外（田畑・淡色）',           c: [139.3400, 35.6600], z: 15.4 },
];
const LIBERTY = 'https://tiles.openfreemap.org/styles/liberty';
const OSM_RASTER = { version: 8, glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
    layers: [{ id: 'osm-tiles', type: 'raster', source: 'osm' }] };

/* ピンの配置（中心からのメートル）。密集の見え方を見るため、右下に4件を12m間隔で置く */
const LAYOUT = [
    ['meijo',    0,    0], ['shop',   -70,  45], ['shop',     35,  60],
    ['castle', -105,  -30], ['zoku',    85, -35], ['manhole',  60,  15],
    ['pokefuta', 118, -12], ['michi',  -45, -55], ['mhcard',  100,  55],
    ['shop',     10,  -40], ['shop',    22, -46], ['shop',      4, -52], ['shop', 18, -58],
];
function buildFeatures(center) {
    const [lng, lat] = center;
    return LAYOUT.map(([t, dx, dy]) => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [
            lng + dx / (111320 * Math.cos(lat * Math.PI / 180)), lat + dy / 110574 ] },
        properties: { t, color: TYPES[t].color, dark: DARK_EDGE[t], icon: TYPES[t].icon || '' },
    }));
}

/* ───────── 涙型ピンの画像を canvas で作る（⑧用） ───────── */
function teardropImage(color, iconImg) {
    const s = 2, W = 34 * s, H = 46 * s;          // 実寸34x46を2倍で描く
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.translate(W / 2, 0);
    // 影
    g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 5 * s; g.shadowOffsetY = 2 * s;
    // 雫形: 上は半径15の円、下は先端へ絞る
    const r = 15 * s, cy = 17 * s, tip = 44 * s;
    g.beginPath();
    g.arc(0, cy, r, Math.PI * 0.82, Math.PI * 0.18, false);
    g.quadraticCurveTo(r * 0.55, tip - 10 * s, 0, tip);
    g.quadraticCurveTo(-r * 0.55, tip - 10 * s, -r * Math.cos(Math.PI * 0.18), cy + r * Math.sin(Math.PI * 0.18));
    g.closePath();
    g.fillStyle = '#FFFFFF'; g.fill();            // 白フチ
    g.shadowColor = 'transparent';
    g.save(); g.translate(0, 1.2 * s); g.scale(0.86, 0.86);
    g.fillStyle = color; g.fill(); g.restore();   // 中の色面
    // 図柄（アルファだけ使って白で塗る）
    if (iconImg) {
        const off = document.createElement('canvas'); off.width = off.height = 26 * s;
        const og = off.getContext('2d');
        og.drawImage(iconImg, 0, 0, 26 * s, 26 * s);
        og.globalCompositeOperation = 'source-in';
        og.fillStyle = '#FFFFFF'; og.fillRect(0, 0, 26 * s, 26 * s);
        g.drawImage(off, -13 * s, cy - 13 * s);
    }
    return g.getImageData(0, 0, W, H);
}

/* ───────── 地図 ───────── */
let state = { variant: 'now', place: 0, tile: 'liberty', pitch: 0 };
const map = new maplibregl.Map({
    container: 'map', style: LIBERTY,
    center: PLACES[0].c, zoom: PLACES[0].z, pitch: 0, attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

const loadedImgs = {};
function loadAll() {
    return Promise.all(Object.entries(ICONS).map(([id, src]) => new Promise(res => {
        const im = new Image();
        im.onload = () => { loadedImgs[id] = im; res(); };
        im.onerror = () => res();
        im.src = src;
    })));
}

function addImages() {
    Object.entries(loadedImgs).forEach(([id, im]) => {
        if (map.hasImage(id)) return;
        map.addImage(id, im, { sdf: true, pixelRatio: id.startsWith('mhcard') ? 2 : 1 });
    });
    // 涙型（種別ごとに1枚）。非SDFなので色は焼き込む
    Object.entries(TYPES).forEach(([t, cfg]) => {
        const id = `drop-${t}`;
        if (map.hasImage(id)) return;
        const icon = cfg.icon ? loadedImgs[cfg.icon] : loadedImgs['manhole-icon'];
        map.addImage(id, teardropImage(cfg.color, icon), { pixelRatio: 2 });
    });
}

function addLayers() {
    map.addSource('objs', { type: 'geojson', data: { type: 'FeatureCollection', features: buildFeatures(PLACES[state.place].c) } });
    map.addSource('sel',  { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

    const circleOnly = ['match', ['get', 't'], ['michi', 'mhcard'], false, true];
    const isMichi    = ['==', ['get', 't'], 'michi'];
    const isCard     = ['==', ['get', 't'], 'mhcard'];

    // 影・グロー・外周（案ごとに出し入れする。既定は非表示）
    map.addLayer({ id: 'o-shadow', type: 'circle', source: 'objs',
        paint: { 'circle-radius': R + 2, 'circle-color': '#000000', 'circle-blur': 0.55, 'circle-opacity': 0 } });
    map.addLayer({ id: 'o-glow', type: 'circle', source: 'objs',
        paint: { 'circle-radius': R + 5, 'circle-color': '#FFFFFF', 'circle-blur': 0.9, 'circle-opacity': 0 } });
    map.addLayer({ id: 'o-outer', type: 'circle', source: 'objs', filter: circleOnly,
        paint: { 'circle-radius': R + 3.5, 'circle-opacity': 0, 'circle-stroke-width': 0, 'circle-stroke-color': 'rgba(0,0,0,0.22)' } });

    // 選択リング（⑨用。index.html の selected-ring-* と同じ寸法）
    map.addLayer({ id: 'sel-outer', type: 'circle', source: 'sel',
        paint: { 'circle-radius': 31, 'circle-opacity': 0, 'circle-stroke-width': 2, 'circle-stroke-color': '#4285F4', 'circle-stroke-opacity': 0.45 } });
    map.addLayer({ id: 'sel-inner', type: 'circle', source: 'sel',
        paint: { 'circle-radius': 23, 'circle-opacity': 0, 'circle-stroke-width': 3, 'circle-stroke-color': '#4285F4' } });

    // 丸のピン
    map.addLayer({ id: 'o-bg', type: 'circle', source: 'objs', filter: circleOnly,
        paint: { 'circle-color': ['get', 'color'], 'circle-radius': R, 'circle-stroke-width': 3, 'circle-stroke-color': '#FFFFFF' } });

    // 道の駅（白い板＋色の板）
    map.addLayer({ id: 'o-michi-edge', type: 'symbol', source: 'objs', filter: isMichi,
        layout: { 'icon-image': 'michi-plate-icon', 'icon-size': (MICHI_PLATE_PX + 6) / OBJ_ICON_NATIVE_PX, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': '#FFFFFF' } });
    map.addLayer({ id: 'o-michi-bg', type: 'symbol', source: 'objs', filter: isMichi,
        layout: { 'icon-image': 'michi-plate-icon', 'icon-size': MICHI_PLATE_PX / OBJ_ICON_NATIVE_PX, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': TYPES.michi.color } });

    // マンホールカード（白フチ画像＋銅色の面＋バッジ）
    map.addLayer({ id: 'o-card-edge', type: 'symbol', source: 'objs', filter: isCard,
        layout: { 'icon-image': 'mhcard-icon', 'icon-size': 1.0, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': '#FFFFFF' } });
    map.addLayer({ id: 'o-card-face', type: 'symbol', source: 'objs', filter: isCard,
        layout: { 'icon-image': 'mhcard-face-icon', 'icon-size': 1.0, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': MHCARD_FACE_COLOR } });
    map.addLayer({ id: 'o-card-badge', type: 'symbol', source: 'objs', filter: isCard,
        layout: { 'icon-image': 'manhole-icon', 'icon-size': MHCARD_BADGE_PX / OBJ_ICON_NATIVE_PX, 'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': '#FFFFFF' } });

    // 図柄（丸と道の駅）
    map.addLayer({ id: 'o-icon', type: 'symbol', source: 'objs', filter: ['!=', ['get', 't'], 'mhcard'],
        layout: { 'icon-image': ['get', 'icon'],
                  'icon-size': ['match', ['get', 't'], 'manhole', OBJ_ICON_INNER_PX / OBJ_ICON_NATIVE_PX,
                                                        'pokefuta', OBJ_ICON_INNER_PX / OBJ_ICON_NATIVE_PX,
                                                        'michi', MICHI_PLATE_PX / OBJ_ICON_NATIVE_PX,
                                                        OBJ_ICON_CIRCLE_PX / OBJ_ICON_NATIVE_PX],
                  'icon-allow-overlap': true, 'icon-ignore-placement': true },
        paint: { 'icon-color': '#FFFFFF' } });

    // 涙型（⑧用。既定は非表示）
    map.addLayer({ id: 'o-drop', type: 'symbol', source: 'objs',
        layout: { 'icon-image': ['concat', 'drop-', ['get', 't']], 'icon-size': 1.0,
                  'icon-anchor': 'bottom', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
                  'visibility': 'none' } });
}

/* 案を地図に流し込む */
let pulseRaf = null;
function applyVariant() {
    const v = VARIANTS.find(x => x.key === state.variant);
    const s = v.spec;

    // 涙型のときは丸・板・図柄をまとめて隠す
    const dropOn = !!s.teardrop;
    ['o-bg', 'o-icon', 'o-michi-edge', 'o-michi-bg', 'o-card-edge', 'o-card-face', 'o-card-badge']
        .forEach(id => map.setLayoutProperty(id, 'visibility', dropOn ? 'none' : 'visible'));
    map.setLayoutProperty('o-drop', 'visibility', dropOn ? 'visible' : 'none');

    // 丸のフチ
    if (!dropOn) {
        map.setPaintProperty('o-bg', 'circle-stroke-width', s.stroke ? s.stroke.width : 0);
        map.setPaintProperty('o-bg', 'circle-stroke-color',
            !s.stroke ? '#FFFFFF' : s.stroke.color === 'dark' ? ['get', 'dark'] : s.stroke.color);
        // 道の駅・カードの白フチ相当
        const pe = s.plateEdge;
        map.setPaintProperty('o-michi-edge', 'icon-color', pe === 'dark' ? ['get', 'dark'] : (pe || 'rgba(0,0,0,0)'));
        map.setPaintProperty('o-card-edge', 'icon-color', pe === 'dark' ? ['get', 'dark'] : (pe || 'rgba(0,0,0,0)'));
    }

    // 影
    const sh = s.shadow;
    map.setPaintProperty('o-shadow', 'circle-opacity', sh ? sh.opacity : 0);
    if (sh) {
        map.setPaintProperty('o-shadow', 'circle-radius', sh.r);
        map.setPaintProperty('o-shadow', 'circle-blur', sh.blur);
        map.setPaintProperty('o-shadow', 'circle-translate', [0, sh.dy || 0]);
        map.setPaintProperty('o-shadow', 'circle-pitch-alignment', sh.ground ? 'map' : 'viewport');
    }

    // ぼかしの白
    map.setPaintProperty('o-glow', 'circle-opacity', s.glow ? s.glow.opacity : 0);
    if (s.glow) { map.setPaintProperty('o-glow', 'circle-radius', s.glow.r); map.setPaintProperty('o-glow', 'circle-blur', s.glow.blur); }

    // 外周の細い暗線
    map.setPaintProperty('o-outer', 'circle-stroke-width', s.outerRing ? s.outerRing.width : 0);
    if (s.outerRing) map.setPaintProperty('o-outer', 'circle-stroke-color', s.outerRing.color);

    // 選択リング（⑨のときだけ中央の1件に出し、半径を脈動させる）
    const sel = map.getSource('sel');
    if (s.selectOnly) {
        sel.setData({ type: 'FeatureCollection', features: [buildFeatures(PLACES[state.place].c)[0]] });
        if (!pulseRaf) {
            const t0 = performance.now();
            const tick = (t) => {
                const k = (Math.sin((t - t0) / 620) + 1) / 2;      // 0..1
                map.setPaintProperty('sel-outer', 'circle-radius', 29 + k * 6);
                map.setPaintProperty('sel-outer', 'circle-stroke-opacity', 0.5 - k * 0.3);
                pulseRaf = requestAnimationFrame(tick);
            };
            pulseRaf = requestAnimationFrame(tick);
        }
    } else {
        sel.setData({ type: 'FeatureCollection', features: [] });
        if (pulseRaf) { cancelAnimationFrame(pulseRaf); pulseRaf = null; }
    }

    // 解説
    document.getElementById('d-title').textContent = v.name;
    document.getElementById('d-aim').textContent = v.aim;
    document.getElementById('d-pro').textContent = '良い点: ' + v.pro;
    document.getElementById('d-con').textContent = '弱点: ' + v.con;
    document.getElementById('d-code').textContent = v.code;
    document.getElementById('d-scope').innerHTML =
        '<b>影響レイヤー</b>: shops-bg / castles-bg / castles-famous-bg / manholes-bg / *-cluster'
        + (v.spec.plateEdge !== undefined ? ' / michi-bg-outline / mhcards-icon' : '')
        + '　<b>実装コスト</b>: ' + v.cost + '　<b>素材</b>: ' + v.asset;

    document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.k === state.variant));
}

/* ───────── UI ───────── */
function buildUI() {
    const chips = document.getElementById('chips');
    VARIANTS.forEach(v => {
        const b = document.createElement('button');
        b.className = 'chip' + (v.base ? ' base' : ''); b.dataset.k = v.key; b.textContent = v.name;
        b.onclick = () => { state.variant = v.key; applyVariant(); };
        chips.appendChild(b);
    });
    const ps = document.getElementById('places');
    PLACES.forEach((p, i) => {
        const b = document.createElement('button');
        b.textContent = p.name; b.className = i === 0 ? 'on' : '';
        b.onclick = () => {
            state.place = i;
            [...ps.children].forEach((c, j) => c.classList.toggle('on', j === i));
            map.jumpTo({ center: p.c, zoom: p.z });
            map.getSource('objs').setData({ type: 'FeatureCollection', features: buildFeatures(p.c) });
            applyVariant();
        };
        ps.appendChild(b);
    });
    const ts = document.getElementById('tiles');
    [['liberty', 'OpenFreeMap Liberty'], ['osm', 'OSMラスタ']].forEach(([k, label], i) => {
        const b = document.createElement('button');
        b.textContent = label; b.className = i === 0 ? 'on' : '';
        b.onclick = () => {
            state.tile = k;
            [...ts.children].forEach(c => c.classList.toggle('on', c === b));
            map.setStyle(k === 'osm' ? OSM_RASTER : LIBERTY);
        };
        ts.appendChild(b);
    });
    const qs = document.getElementById('pitches');
    [0, 45, 60].forEach((p, i) => {
        const b = document.createElement('button');
        b.textContent = p + '°'; b.className = i === 0 ? 'on' : '';
        b.onclick = () => {
            state.pitch = p;
            [...qs.children].forEach(c => c.classList.toggle('on', c === b));
            map.easeTo({ pitch: p, duration: 400 });
        };
        qs.appendChild(b);
    });
    const tb = document.querySelector('#tbl tbody');
    VARIANTS.forEach(v => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><b>${v.name}</b></td><td>${v.aim}</td><td class="cost">${v.cost}</td><td>${v.asset}</td>`;
        tb.appendChild(tr);
    });
}

loadAll().then(() => {
    buildUI();
    /* 'load' はタイルが1枚も届かないと発火しないため、待たずに styledata で入れる。
       タイルを切り替えるとカスタムのソース・レイヤー・画像が消えるので、都度入れ直す。 */
    const ensureSetup = () => {
        if (!map.style || !map.getStyle() || map.getSource('objs')) return;
        addImages(); addLayers(); applyVariant();
    };
    map.on('styledata', ensureSetup);
    map.on('load', ensureSetup);
    ensureSetup();
});
</script>
</body>
