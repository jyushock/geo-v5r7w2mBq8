<!DOCTYPE html>
<html lang="ja">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真ビューアのPC表示 黒余白の対策案</title>
<style>
  body { font-family: sans-serif; background: #ececec; padding: 16px; margin: 0; color: #222; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  .lead { font-size: 12px; color: #555; line-height: 1.8; margin: 0 0 10px; max-width: 1150px; }
  .lead b { color: #b00; }
  code { background: #fff; padding: 0 3px; border-radius: 3px; font-size: 11px; }

  #ctl { position: sticky; top: 0; z-index: 60; background: #fff; border: 1px solid #ccc; border-radius: 8px;
         padding: 9px 12px; margin: 0 0 12px; font-size: 12px; display: flex; gap: 18px; align-items: center;
         flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,.13); }
  #ctl .gl { font-weight: bold; color: #555; margin-right: 4px; }
  #ctl button { font-size: 12px; padding: 4px 9px; border: 1px solid #bbb; background: #f7f7f7;
                border-radius: 5px; cursor: pointer; }
  #ctl button.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }

  .stage { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  /* 画面枠。実装では position:fixed だが、モックでは枠内に閉じ込めるため relative */
  .screen { position: relative; border: 1px solid #999; overflow: hidden; flex-shrink: 0;
            background: repeating-linear-gradient(45deg, #e8efe8 0 16px, #dfe8df 16px 32px); }
  .screen::after { content: attr(data-label); position: absolute; top: 4px; left: 6px; font-size: 10px;
                   color: #567; z-index: 1; }

  /* ── 実装(index.html)の #photo-viewer と同じ構造 ── */
  .viewer { position: absolute; inset: 0; z-index: 40; }
  .backdrop { position: absolute; inset: 0; background: #000; }
  .track { position: absolute; inset: 0; display: flex; }
  .pane { width: 100%; height: 100%; flex-shrink: 0; display: flex; align-items: center;
          justify-content: center; overflow: hidden; }
  .inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .inner img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; color: #fff; padding: 30px 14px 12px;
          background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0)); }
  .info .t { font-size: 14px; font-weight: bold; }
  .info .s { font-size: 11px; opacity: .85; margin-top: 3px; }
  .info .acts { display: flex; gap: 8px; margin-top: 9px; }
  .info .acts button { flex: 1; font-size: 12px; padding: 9px 0; border-radius: 6px; border: none;
                       background: rgba(255,255,255,.16); color: #fff; font-family: inherit; }
  .dots { position: absolute; left: 0; right: 0; bottom: 84px; z-index: 5; display: flex; gap: 6px;
          justify-content: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots i.on { background: #fff; }

  /* ══ 案A: 画面にフィット（上限なし） ══ */
  .viewer.fit .inner img { width: 100%; height: 100%; max-width: none; max-height: none; }
  /* ══ 案C: 暗幕を半透明にして地図を透かす ══ */
  .viewer.scrim .backdrop { background: rgba(0,0,0,.72); }
  .viewer.scrim .inner img { box-shadow: 0 6px 28px rgba(0,0,0,.6); border-radius: 4px; }

  table.calc { border-collapse: collapse; font-size: 11.5px; background: #fff; margin: 8px 0 0; }
  table.calc th, table.calc td { border: 1px solid #ddd; padding: 4px 9px; text-align: left; white-space: nowrap; }
  table.calc th { background: #f4f4f4; }
  table.calc td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.calc tr.warn td { background: #fdecea; }
  table.calc tr.good td { background: #e8f5e9; }
  .side { width: 420px; font-size: 12px; line-height: 1.75; }
  .side h3 { font-size: 13px; margin: 0 0 6px; }
  .side ul { margin: 4px 0 12px; padding-left: 18px; }
  .side .ok { color: #0a7a2f; font-weight: bold; }
  .side .ng { color: #b00; font-weight: bold; }
</style>
</head>
<body>

<h1>写真ビューアのPC表示 — 黒余白の対策案</h1>
<p class="lead">
  現状は<b>等倍を超えて引き伸ばさない</b>方針（<code>max-width/max-height:100%</code>）。
  スマホは画像より画面が小さいので常に縮小がかかり支障ないが、PCでは画像が原寸のまま中央に置かれ、周囲が黒く余る。<br>
  下のスマホ枠とPC枠を見比べる。<b>いずれの案もアスペクト比は維持</b>（<code>object-fit:contain</code>）。
  案の適用は <code>@media (min-width:768px)</code> で切るため、<b>スマホ表示は現状のまま変わらない</b>。
</p>

<div id="ctl">
  <span class="gl">案</span><span id="plans"></span>
  <span class="gl">画像</span><span id="imgs"></span>
</div>

<div class="stage">
  <div>
    <div class="screen" id="sp" data-label="スマホ 390×844（常に現状の見え方）" style="width:390px;height:600px"></div>
  </div>
  <div>
    <div class="screen" id="pc" data-label="PC 1280×800" style="width:640px;height:400px"></div>
    <div style="font-size:11px;color:#666;margin-top:4px">※PC枠は 1280×800 を50%に縮小して表示（比率と黒面積は同じ）</div>
  </div>
  <div class="side">
    <h3 id="ptitle"></h3>
    <div id="pdesc"></div>
    <h3>黒余白の割合（実測計算）</h3>
    <table class="calc" id="tbl"></table>
  </div>
</div>

<script>
// 解像度はすべて naturalWidth/naturalHeight の実測値
const IMAGES = [
  { key: 'pano',  name: '城 攻城団パノラマ', w: 720,  h: 240 },
  { key: 'shiro', name: '城 城郭放浪記',     w: 640,  h: 480 },
  { key: 'wiki',  name: '城 Wikipedia',      w: 1280, h: 853 },
  { key: 'card',  name: 'マンホールカード',  w: 516,  h: 720 },
  { key: 'poke',  name: 'ポケふた',          w: 750,  h: 750 },
];
const PLANS = [
  { key: '現状', cls: '', desc: `
    <ul>
      <li>等倍を超えて引き伸ばさない。<b>画質は最良</b>だがPCでは小さく、黒が大きく余る。</li>
      <li class="ng">1920×1080では黒が最大91.7%。</li>
    </ul>` },
  { key: '案A 画面にフィット', cls: 'fit', desc: `
    <ul>
      <li><code>@media (min-width:768px)</code> で <code>width/height:100%</code> にする。
          <code>object-fit:contain</code> なので<b>比率は維持</b>。</li>
      <li class="ok">黒余白が最も減る（1920×1080で16〜41%）。</li>
      <li class="ng">引き伸ばしでぼやける。特に攻城団パノラマは1920幅で<b>2.67倍</b>。
          720×240の横長は元が小さいので粗さが出やすい。</li>
      <li>CSSのみ・数行で済む。</li>
    </ul>` },
  { key: '案B フィット＋上限1.6倍', cls: 'fit limit', desc: `
    <ul>
      <li>案Aに拡大上限を付ける。CSSだけでは画像の実寸を知れないので、
          JSで <code>naturalWidth</code> を読み <code>max-width/max-height</code> を設定する。</li>
      <li class="ok">ぼやけを抑えつつ、現状よりは黒が減る。</li>
      <li class="ng">中途半端になりやすい。パノラマは1.6倍でも黒78.7%で改善が小さい。</li>
      <li>実装はJS数行の追加。</li>
    </ul>` },
  { key: '案C 暗幕を半透明に', cls: 'scrim', desc: `
    <p class="ng">※ 実装して検証した結果、この案は不採用。下記の理由による。</p>
    <ul>
      <li>背景を <code>#000</code> から <code>rgba(0,0,0,.72)</code> にして、背後の地図を透かす。
          画像サイズは変えない。</li>
      <li class="ok"><b>画質は完全に維持</b>。黒ベタの圧迫感が「暗くした地図」に変わる。</li>
      <li class="ng">黒余白の<b>面積そのものは減らない</b>。大きく見たい要求には応えない。</li>
      <li class="ng"><b>実アプリでは成立しない。</b>このモックは背後が地図だけだが、
          実際の写真ビューアの背後には<b>白背景の情報シートが常に開いている</b>。
          暗幕を薄くすると GoogleMap・アクセス等のボタンや城のサムネイルが透けて見え、
          情報帯の文字と重なって読めなくなる（1280×800で実測確認）。</li>
    </ul>` },
  { key: '案D A＋C', cls: 'fit scrim', desc: `
    <p class="ng">※ 案Cの部分が実アプリで成立しないため不採用。<b>案Aのみを採用して実装済み。</b></p>
    <ul>
      <li>PCでは画面にフィットさせ、かつ暗幕を半透明にする。</li>
      <li class="ok">面積も圧迫感も同時に減る。</li>
      <li class="ng">背後の情報シートが透ける問題は案Cと同じ。</li>
    </ul>
    <p><b>採用した案Aの実測値（実描画サイズ基準）</b></p>
    <ul>
      <li>1264×705: パノラマ 83.1%→<b>40.2%</b> / 城郭放浪記 70.0%→<b>25.6%</b> / カード 63.7%→<b>60.0%</b></li>
      <li>1904×985: パノラマ 91.7%→<b>35.6%</b> / 城郭放浪記 85.2%→<b>31.0%</b> / カード 82.1%→<b>62.9%</b></li>
      <li>縦長のカードは画面が横長なため改善が小さい。形状差によるもので比率を保つ限り不可避。</li>
    </ul>` },
];

let curPlan = PLANS[0], curImg = IMAGES[0];
const $ = id => document.getElementById(id);

// 実解像度どおりのダミー画像をcanvasで作る（外部取得なしで見え方を比較するため）
const cache = {};
function dataUrl(w, h, label) {
  const k = w + 'x' + h;
  if (cache[k]) return cache[k];
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, w, h);
  gr.addColorStop(0, '#3b6ea5'); gr.addColorStop(1, '#22406a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = Math.max(1, Math.min(w, h) / 120);
  for (let x = 0; x <= w; x += w / 12) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y <= h; y += h / 12) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.fillStyle = '#fff'; g.font = `bold ${Math.round(Math.min(w, h) / 7)}px sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, w / 2, h / 2);
  return (cache[k] = cv.toDataURL('image/png'));
}

function viewerHtml() {
  const dots = IMAGES.length > 1 ? `<div class="dots">${'<i></i>'.repeat(3).replace('<i>', '<i class="on">')}</div>` : '';
  return `<div class="viewer ${curPlan.cls}">
    <div class="backdrop"></div>
    <div class="track"><div class="pane"><div class="inner">
      <img src="${dataUrl(curImg.w, curImg.h, curImg.w + '×' + curImg.h)}"></div></div></div>
    ${dots}
    <div class="info"><div class="t">五稜郭</div><div class="s">北海道函館市五稜郭町　/　攻城団</div>
      <div class="acts"><button>閉じる</button></div></div>
  </div>`;
}

// 案Bの上限は画像の実寸に依存するのでJSで設定する
function applyLimit(root, scaleOfFrame) {
  if (curPlan.cls.indexOf('limit') < 0) return;
  const img = root.querySelector('.inner img');
  if (!img) return;
  img.style.maxWidth = (curImg.w * 1.6 * scaleOfFrame) + 'px';
  img.style.maxHeight = (curImg.h * 1.6 * scaleOfFrame) + 'px';
}

function render() {
  [...$('plans').children].forEach(b => b.classList.toggle('on', b.dataset.p === curPlan.key));
  [...$('imgs').children].forEach(b => b.classList.toggle('on', b.dataset.i === curImg.key));
  $('ptitle').textContent = curPlan.key;
  $('pdesc').innerHTML = curPlan.desc;

  // スマホ枠は常に現状の見え方（案はPC幅にだけ効かせる前提なので class を付けない）
  const spPlan = curPlan; curPlan = PLANS[0];
  $('sp').innerHTML = viewerHtml();
  curPlan = spPlan;

  $('pc').innerHTML = viewerHtml();
  applyLimit($('pc'), 0.5);   // PC枠は50%縮小表示なので上限もスケールする
  buildTable();
}

function buildTable() {
  const screens = [['スマホ 390×844', 390, 844], ['PC 1280×800', 1280, 800], ['PC 1920×1080', 1920, 1080]];
  const fit = curPlan.cls.indexOf('fit') >= 0;
  const limited = curPlan.cls.indexOf('limit') >= 0;
  let html = '<tr><th>画面</th><th>表示サイズ</th><th>倍率</th><th>黒余白</th></tr>';
  screens.forEach(([nm, sw, sh], i) => {
    // スマホは常に現状の計算（案はPC幅にのみ適用する前提）
    const applyPlan = i > 0;
    let k = Math.min(sw / curImg.w, sh / curImg.h);
    if (!applyPlan || !fit) k = Math.min(k, 1);
    if (applyPlan && fit && limited) k = Math.min(k, 1.6);
    const dw = curImg.w * k, dh = curImg.h * k;
    const black = 1 - (dw * dh) / (sw * sh);
    const cls = black > 0.7 ? 'warn' : (black < 0.45 ? 'good' : '');
    html += `<tr class="${cls}"><td>${nm}</td><td class="n">${dw.toFixed(0)}×${dh.toFixed(0)}</td>`
          + `<td class="n">${k.toFixed(2)}倍</td><td class="n">${(black * 100).toFixed(1)}%</td></tr>`;
  });
  $('tbl').innerHTML = html;
}

$('plans').innerHTML = PLANS.map(p => `<button data-p="${p.key}">${p.key}</button>`).join(' ');
$('imgs').innerHTML = IMAGES.map(i => `<button data-i="${i.key}">${i.name}</button>`).join(' ');
$('plans').onclick = e => { if (e.target.dataset.p) { curPlan = PLANS.find(p => p.key === e.target.dataset.p); render(); } };
$('imgs').onclick = e => { if (e.target.dataset.i) { curImg = IMAGES.find(i => i.key === e.target.dataset.i); render(); } };
render();
</script>
</body>
</html>
