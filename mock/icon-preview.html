<!DOCTYPE html>
<html lang="ja">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイコンプレビュー</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; padding: 16px; }
  h2 { font-size: 13px; color: #555; margin: 0 0 8px; }
  .section { display: flex; gap: 20px; flex-wrap: wrap; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 280px;
  }
  .item {
    display: flex; flex-direction: column; align-items: center;
    gap: 0px; padding: 2px 4px; border-radius: 10px;
    background: #f8f8f8; border: 2px solid transparent;
    cursor: pointer; height: 52px; justify-content: center;
    overflow: hidden;
  }
  .item:hover { background: #e8f0fe; border-color: #4285F4; }
  .item:hover .label { color: #4285F4; font-weight: bold; }
  .sprite-icon { width: 38px; height: 38px; flex-shrink: 0; }
  .sprite-icon svg { width: 38px; height: 38px; }
  .item:hover .sprite-icon { opacity: 0.75; }
  .emoji { font-size: 30px; line-height: 1.2; }
  .label { font-size: 8px; color: #555; text-align: center; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>

<div class="section">

  <div class="col">
    <h2>① 現在（絵文字）</h2>
    <div class="grid">
      <div class="item"><span class="emoji">📍</span><span class="label">スポット</span></div>
      <div class="item"><span class="emoji">🛒</span><span class="label">スーパー</span></div>
      <div class="item"><span class="emoji">🚆</span><span class="label">駅/バス停</span></div>
      <div class="item"><span class="emoji">🍽</span><span class="label">レストラン</span></div>
      <div class="item"><span class="emoji">☕</span><span class="label">カフェ</span></div>
      <div class="item"><span class="emoji">🗿</span><span class="label">像</span></div>
      <div class="item"><span class="emoji">🥙</span><span class="label">テイクアウト</span></div>
      <div class="item"><span class="emoji">🏛</span><span class="label">ミュージアム</span></div>
      <div class="item"><span class="emoji">🍜</span><span class="label">ラーメン</span></div>
      <div class="item"><span class="emoji">🍲</span><span class="label">うどん</span></div>
      <div class="item"><span class="emoji">🥢</span><span class="label">そば</span></div>
      <div class="item"><span class="emoji">🗺</span><span class="label">観光スポット</span></div>
      <div class="item"><span class="emoji">🍣</span><span class="label">寿司</span></div>
      <div class="item"><span class="emoji">💊</span><span class="label">ドラッグストア</span></div>
      <div class="item"><span class="emoji">💴</span><span class="label">100円ショップ</span></div>
      <div class="item"><span class="emoji">🏨</span><span class="label">ホテル</span></div>
    </div>
  </div>

</div>

  <div class="col">
    <h2>③ ベクター化SVG</h2>
    <div class="grid">
      <div class="item"><div class="sprite-icon" data-vb="27 60 220 170" style="color:#4285F4"></div><span class="label">スポット</span></div>
      <div class="item"><div class="sprite-icon" data-vb="267 60 220 170" style="color:#34A853"></div><span class="label">スーパー</span></div>
      <div class="item"><div class="sprite-icon" data-vb="505 60 220 170" style="color:#1565C0"></div><span class="label">駅/バス停</span></div>
      <div class="item"><div class="sprite-icon" data-vb="745 60 220 170" style="color:#FF5722"></div><span class="label">レストラン</span></div>
      <div class="item"><div class="sprite-icon" data-vb="27 275 220 170" style="color:#795548"></div><span class="label">カフェ</span></div>
      <div class="item"><div class="sprite-icon" data-vb="267 275 220 170" style="color:#607D8B"></div><span class="label">像</span></div>
      <div class="item"><div class="sprite-icon" data-vb="505 275 220 170" style="color:#FF9800"></div><span class="label">テイクアウト</span></div>
      <div class="item"><div class="sprite-icon" data-vb="745 275 220 170" style="color:#7B1FA2"></div><span class="label">ミュージアム</span></div>
      <div class="item"><div class="sprite-icon" data-vb="27 502 220 170" style="color:#F44336"></div><span class="label">ラーメン</span></div>
      <div class="item"><div class="sprite-icon" data-vb="267 502 220 170" style="color:#FFA000"></div><span class="label">うどん</span></div>
      <div class="item"><div class="sprite-icon" data-vb="505 502 220 170" style="color:#8D6E63"></div><span class="label">そば</span></div>
      <div class="item"><div class="sprite-icon" data-vb="745 502 220 170" style="color:#00897B"></div><span class="label">観光スポット</span></div>
      <div class="item"><div class="sprite-icon" data-vb="27 745 220 170" style="color:#E91E63"></div><span class="label">寿司</span></div>
      <div class="item"><div class="sprite-icon" data-vb="267 745 220 170" style="color:#00897B"></div><span class="label">ドラッグストア</span></div>
      <div class="item"><div class="sprite-icon" data-vb="505 745 220 170" style="color:#D32F2F"></div><span class="label">100円ショップ</span></div>
      <div class="item"><div class="sprite-icon" data-vb="745 745 220 170" style="color:#1976D2"></div><span class="label">ホテル</span></div>
    </div>
  </div>

</div>

<p style="font-size:11px;color:#999;margin-top:16px;">※ アイコンにカーソルを乗せると選択時のイメージが確認できます</p>

<script>
fetch('icons-raw.svg')
  .then(r => r.text())
  .then(svgText => {
    const m = svgText.match(/<g[^>]*>([\s\S]*)<\/g>/);
    if (!m) { console.error('paths not found'); return; }
    const inner = m[1];
    document.querySelectorAll('.sprite-icon').forEach(el => {
      const vb = el.dataset.vb;
      el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="${vb}"><g fill="currentColor">${inner}</g></svg>`;
    });
  })
  .catch(e => console.error('fetch error:', e));
</script>
</body>
</html>
